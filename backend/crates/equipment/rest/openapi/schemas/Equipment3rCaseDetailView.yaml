allOf:
  - $ref: '#/components/schemas/Equipment3rCaseView'
  - type: object
    required:
      - inspections
      - createdBy
      - createdAt
      - updatedAt
    properties:
      approval: {type: [object, 'null'], properties: {decision: {type: string, enum: [APPROVED, DECLINED]}, reason: {type: [string, 'null']}, decidedBy: {$ref: '#/components/schemas/Uuid'}, decidedAt: {type: string, format: date-time}}}
      dispatch: {type: [object, 'null'], properties: {carrierName: {type: string}, vehicleReference: {type: string}, dispatchedAt: {type: string, format: date-time}}}
      handover: {type: [object, 'null'], properties: {recipientName: {type: string}, evidenceObjectId: {$ref: '#/components/schemas/Uuid'}, handedOverAt: {type: string, format: date-time}}}
      returnedAt: {type: [string, 'null'], format: date-time}
      assessment: {type: [object, 'null'], properties: {conditionGrade: {type: string, enum: [A, B, C, D]}, findings: {type: string}, disposition: {type: string, enum: [REPAIR, REFURBISH, RESALE, REDEPLOY]}, assessedBy: {$ref: '#/components/schemas/Uuid'}, assessedAt: {type: string, format: date-time}}}
      dispositionId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
      inspections: {type: array, items: {$ref: '#/components/schemas/Equipment3rInspectionView'}}
      createdBy: {$ref: '#/components/schemas/Uuid'}
      createdAt: {type: string, format: date-time}
      updatedAt: {type: string, format: date-time}
