type: object
required:
  - id
  - unitId
  - caseId
  - kind
  - status
  - completedBy
  - completedAt
  - financeGlPosting
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  unitId:
    $ref: '#/components/schemas/Uuid'
  caseId:
    $ref: '#/components/schemas/Uuid'
  kind:
    type: string
    enum:
      - REPAIR
      - REFURBISH
      - RESALE
      - REDEPLOY
  status:
    type: string
    enum:
      - OPEN
      - COMPLETED
  costMinor:
    type:
      - integer
      - 'null'
    format: int64
  saleAmountMinor:
    type:
      - integer
      - 'null'
    format: int64
  buyerName:
    type:
      - string
      - 'null'
  completedBy:
    $ref: '#/components/schemas/Uuid'
  completedAt:
    type: string
    format: date-time
  financeGlPosting:
    description: Always null — the pilot records no GL posting
    type: 'null'
