type: object
required:
  - id
  - diagnostic_id
  - statement
  - evidence_id
  - created_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  diagnostic_id:
    $ref: '#/components/schemas/Uuid'
  statement:
    type: string
  evidence_id:
    $ref: '#/components/schemas/Uuid'
  document_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  created_at:
    type: string
    format: date-time
