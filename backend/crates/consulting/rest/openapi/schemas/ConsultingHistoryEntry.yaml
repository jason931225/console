type: object
required:
  - id
  - event_type
  - version
  - payload
  - occurred_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  event_type:
    type: string
  from_status:
    type:
      - string
      - 'null'
  to_status:
    type:
      - string
      - 'null'
  version:
    type: integer
    format: int64
  payload:
    type: object
    additionalProperties: true
  occurred_at:
    type: string
    format: date-time
