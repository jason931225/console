type: object
required:
  - id
  - customer_id
  - title
  - status
  - version
  - created_at
  - updated_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  customer_id:
    $ref: '#/components/schemas/Uuid'
  customer_document_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  ontology_instance_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  title:
    type: string
  status:
    type: string
    enum:
      - DRAFT
      - PROPOSED
      - APPROVED
      - IMPLEMENTED
      - MEASURED
      - SUSTAINED
      - CORRECTIVE
  approval_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  workflow_execution_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  version:
    type: integer
    format: int64
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
