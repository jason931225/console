type: object
additionalProperties: false
required:
  - diagnosticId
  - statement
  - evidenceId
properties:
  diagnosticId:
    $ref: '#/components/schemas/Uuid'
  statement:
    type: string
    minLength: 1
  evidenceId:
    $ref: '#/components/schemas/Uuid'
  documentId:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
