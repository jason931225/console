    $ref: '#/components/schemas/Uuid'
  customerDocumentId:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  ontologyInstanceId:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
