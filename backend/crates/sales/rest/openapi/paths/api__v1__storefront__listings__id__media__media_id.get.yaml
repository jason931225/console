tags:
  - storefront
operationId: storefrontGetListingMedia
summary: Serve one public sales-listing photo (#6)
description: Public, unauthenticated serve of one listing photo's bytes, streamed from the object store. The media must
  belong to the listing and the listing must be storefront-visible (published/reserved); otherwise 404. The response
  body is the raw image with its stored content type.
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
- name: media_id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: The listing photo bytes.
    content:
      image/*:
        schema:
          type: string
          format: binary
  '404':
    $ref: '#/components/responses/NotFound'
