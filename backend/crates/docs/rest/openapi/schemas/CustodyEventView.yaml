type: object
required:
  - id
  - evidence_object_id
  - stage
  - actor_user_id
  - reason
  - event_digest_sha256
  - occurred_at
  - created_at
properties:
  id:
    type: string
    format: uuid
  evidence_object_id:
    type: string
    format: uuid
  stage:
    $ref: '#/components/schemas/CustodyStage'
  actor_user_id:
    type: string
    format: uuid
  from_custodian:
    type:
      - object
      - 'null'
    additionalProperties: true
  to_custodian:
    type:
      - object
      - 'null'
    additionalProperties: true
  location_label:
    type:
      - string
      - 'null'
  reason:
    type: string
  source_ref:
    oneOf:
      - {$ref: '#/components/schemas/EvidenceSourceRef'}
      - {type: 'null'}
  audit_event_id:
    type:
      - string
      - 'null'
    format: uuid
  previous_event_id:
    type:
      - string
      - 'null'
    format: uuid
  event_digest_sha256:
    type: string
  occurred_at:
    type: string
    format: date-time
  created_at:
    type: string
    format: date-time
