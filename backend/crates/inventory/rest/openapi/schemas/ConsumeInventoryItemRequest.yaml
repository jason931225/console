type: object
additionalProperties: false
required:
  - source
  - quantityConsumedMilli
  - idempotencyKey
properties:
  source:
    $ref: '#/components/schemas/InventoryConsumptionSource'
  quantityConsumedMilli:
    type: integer
    format: int64
    minimum: 1
  occurredAt:
    type:
      - string
      - 'null'
    format: date-time
  memo:
    type:
      - string
      - 'null'
  idempotencyKey:
    type: string
    minLength: 16
    maxLength: 200
