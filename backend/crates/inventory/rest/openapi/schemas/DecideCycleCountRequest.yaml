type: object
additionalProperties: false
required:
  - expectedVersion
  - decision
properties:
  expectedVersion:
    type: integer
    minimum: 1
  decision:
    type: string
    enum:
      - APPROVE
      - REJECT
  memo:
    type:
      - string
      - 'null'
  idempotencyKey:
    type:
      - string
      - 'null'
    minLength: 16
    maxLength: 200
