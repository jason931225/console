type: object
additionalProperties: false
required:
  - quantityReceivedMilli
  - idempotencyKey
properties:
  quantityReceivedMilli:
    type: integer
    format: int64
    minimum: 1
  sourceRef:
    type:
      - string
      - 'null'
  memo:
    type:
      - string
      - 'null'
  idempotencyKey:
    type: string
    minLength: 16
    maxLength: 200
