type: object
additionalProperties: false
required:
  - expectedVersion
  - itemId
  - countedQuantityMilli
properties:
  expectedVersion:
    type: integer
    minimum: 1
  itemId:
    $ref: '#/components/schemas/Uuid'
  countedQuantityMilli:
    type: integer
    format: int64
    minimum: 0
  reason:
    oneOf:
      - {type: string, enum: [DAMAGE, LOSS, MISCOUNT, FOUND, OTHER]}
      - {type: 'null'}
  note:
    type:
      - string
      - 'null'
