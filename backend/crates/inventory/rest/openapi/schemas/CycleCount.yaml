type: object
required:
  - id
  - ccCode
  - branchId
  - stockLocation
  - status
  - version
  - openedBy
  - lineCount
  - varianceLineCount
  - createdAt
  - updatedAt
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  ccCode:
    type: string
  branchId:
    $ref: '#/components/schemas/Uuid'
  stockLocation:
    $ref: '#/components/schemas/InventoryStockLocationSummary'
  status:
    type: string
    enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - REJECTED
      - CANCELLED
  version:
    type: integer
  openedBy:
    $ref: '#/components/schemas/Uuid'
  submittedBy:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  submittedAt:
    type:
      - string
      - 'null'
    format: date-time
  decidedBy:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  decidedAt:
    type:
      - string
      - 'null'
    format: date-time
  decisionMemo:
    type:
      - string
      - 'null'
  lineCount:
    type: integer
    format: int64
  varianceLineCount:
    type: integer
    format: int64
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
