type: object
required:
  - id
  - code
  - kind
  - status
  - employee_id
  - employee_name
  - work_date
  - occurred_at
  - detail
  - evidence
  - links
  - created_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  code:
    type: string
  kind:
    type: string
    enum:
      - LATE
      - NO_SHOW
      - UNAPPROVED_OVERTIME
      - EARLY_LEAVE
  status:
    type: string
    enum:
      - OPEN
      - RESOLVED
  employee_id:
    $ref: '#/components/schemas/Uuid'
  employee_name:
    type: string
  team:
    type:
      - string
      - 'null'
  branch_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  work_date:
    type: string
    format: date
  occurred_at:
    type: string
    format: date-time
  detail:
    type: string
  evidence:
    type: array
    items:
      $ref: '#/components/schemas/AttendanceExceptionEvidence'
  links:
    type: array
    items:
      $ref: '#/components/schemas/AttendanceExceptionLink'
  resolution:
    oneOf:
      - {$ref: '#/components/schemas/AttendanceExceptionResolution'}
      - {type: 'null'}
  created_at:
    type: string
    format: date-time
