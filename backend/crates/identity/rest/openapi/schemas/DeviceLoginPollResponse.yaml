type: object
required:
  - status
properties:
  status:
    type: string
    enum:
      - pending
      - approved
      - expired
  access_token:
    type:
      - string
      - 'null'
  refresh_token:
    type:
      - string
      - 'null'
    description: Null in web cookie transport; present in body transport.
  token_type:
    oneOf:
      - {type: string, enum: [Bearer]}
      - {type: 'null'}
  refresh_expires_at:
    type:
      - string
      - 'null'
    format: date-time
  requires_passkey_setup:
    type:
      - boolean
      - 'null'
    description: Approved desktop QR sessions are passkey-authenticated and return false.
