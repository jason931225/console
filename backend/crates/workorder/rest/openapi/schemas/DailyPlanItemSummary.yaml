type: object
required:
  - description
  - sort_order
properties:
  work_order_id:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  request_no:
    type:
      - string
      - 'null'
  equipment_no:
    type:
      - string
      - 'null'
  management_no:
    type:
      - string
      - 'null'
  customer_name:
    type:
      - string
      - 'null'
  site_name:
    type:
      - string
      - 'null'
  description:
    type: string
  sort_order:
    type: integer
    format: int32
