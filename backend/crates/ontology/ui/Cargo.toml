[package]
name = "console-ontology-ui"
version = "0.1.0"
description = "SSR pages and island editors for Company, OrgUnit, JobPosition, Person, and Employment."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Must be "lib", not "rlib": cargo metadata reports kind=lib only then, and that is
# the executed-tests --lib binary.
crate-type = ["lib"]

[features]
default = []
ssr = ["leptos/ssr", "leptos/islands"]
hydrate = ["leptos/hydrate", "leptos/islands"]

[dependencies]
leptos = { workspace = true, features = ["islands"] }
serde = { workspace = true }

[lints]
workspace = true
