operationId: getOrgUnit
summary: Get a canonical OrgUnit head
description: >-
  Returns one OrgUnit Head — the current latest revision (`MAX(version)`), the
  same row `get` already returns. as_of is omitted: `org_units` /
  `org_unit_revisions` have no valid-time columns, and using `created_at` as
  `valid_from` would be a second time model. A miss or a foreign tenant is 404
  (deny-by-omission). Sites, regions, and branches stay the operational auth
  spine and are not OrgUnits. EmployeeDetail as_of remains HOLD.
tags:
- Ontology
security:
- bearerAuth: []
permissions:
- employee_directory_read
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Current OrgUnit head.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/OrgUnit'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '404':
    $ref: '#/components/responses/NotFound'
