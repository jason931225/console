operationId: listOrgUnitJobPositions
summary: List JobPosition heads under one OrgUnit
description: >-
  Returns current JobPosition Heads whose `org_unit_id` is this OrgUnit — the
  same rows `list_for_org_unit` already returns (latest revision,
  `MAX(version)`). as_of / from / to are omitted: `job_positions` /
  `job_position_revisions` have no valid-time columns, and using `created_at`
  as `valid_from` would be a second time model. Empty when the unit has no
  positions or is invisible to the armed tenant (same as the port; a missing
  OrgUnit is GET /api/v1/org-units/{id} 404, not this collection). Distinct
  from GET /api/v1/job-positions (tenant-wide list) and from recruiting
  postings / `employees.position` TEXT. EmployeeDetail as_of remains HOLD.
tags:
- Ontology
security:
- bearerAuth: []
permissions:
- employee_directory_read
parameters:
- name: id
  in: path
  required: true
  schema:
    $ref: '#/components/schemas/Uuid'
responses:
  '200':
    description: Current JobPosition heads under the OrgUnit.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/JobPosition'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
