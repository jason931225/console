operationId: listEmployments
summary: List canonical Employment heads (current or overlapping from/to)
description: >-
  Returns Employment Heads whose `[valid_from, valid_to)` overlaps the query
  window `[from, to)`. Absent from and to is current *open* heads
  (`employment_heads.valid_to IS NULL`), the same rows `get`/`list` already
  return. from and to copy the instance-GET Timestamp shape: optional RFC3339
  instants. Overlap is the same half-open algebra as GET
  /api/v1/employments/{id}?as_of= and GET /api/v1/ontology/instances/{id}?as_of=
  (`valid_from < to` AND `valid_to IS NULL OR from < valid_to`; a missing bound
  is unbounded). Each Head is reconstructed at `greatest(from, valid_from)` when
  from is set, otherwise at the latest revision with `valid_from < to`. Inverted
  `from >= to` is 422. Closed (EXITED) windows appear only when the query window
  overlaps them. The Head never includes phone, salary, bank_account, rrn, or
  base_pay. EmployeeDetail as_of remains HOLD. Corrections vs new slice and
  delta transmission remain HOLD.
tags:
- Ontology
security:
- bearerAuth: []
permissions:
- employee_directory_read
parameters:
- name: from
  in: query
  required: false
  description: Inclusive RFC3339 start of the half-open collection window; absent = unbounded below.
  schema:
    $ref: '#/components/schemas/Timestamp'
- name: to
  in: query
  required: false
  description: Exclusive RFC3339 end of the half-open collection window; absent = unbounded above.
  schema:
    $ref: '#/components/schemas/Timestamp'
responses:
  '200':
    description: Employment heads overlapping [from, to), or current open heads when both are absent.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Employment'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
  '422':
    $ref: '#/components/responses/ValidationError'
