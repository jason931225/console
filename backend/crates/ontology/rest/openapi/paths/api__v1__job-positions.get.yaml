operationId: listJobPositions
summary: List canonical JobPosition heads
description: >-
  Returns current JobPosition Heads in the armed tenant — the same rows `list`
  already returns (latest revision, `MAX(version)`). as_of / from / to are
  omitted: `job_positions` / `job_position_revisions` have no valid-time
  columns, and using `created_at` as `valid_from` would be a second time
  model. Empty when none are visible. Distinct from recruiting postings and
  from `employees.position` TEXT. EmployeeDetail as_of remains HOLD.
tags:
- Ontology
security:
- bearerAuth: []
permissions:
- employee_directory_read
responses:
  '200':
    description: Current JobPosition heads.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/JobPosition'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
