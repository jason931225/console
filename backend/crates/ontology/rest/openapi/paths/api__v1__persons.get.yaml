operationId: listPersons
summary: List canonical Person heads
description: >-
  Returns current Person Heads in the armed tenant — the same closed
  four-field projection `list` already returns (latest revision,
  `MAX(version)`). as_of / from / to are omitted: `persons` /
  `person_revisions` have no valid-time columns, and using `created_at` as
  `valid_from` would be a second time model. Empty when none are visible.
  The Head never includes phone, salary, bank_account, or rrn.
  EmployeeDetail as_of remains HOLD.
tags:
- Ontology
security:
- bearerAuth: []
permissions:
- employee_directory_read
responses:
  '200':
    description: Current Person heads.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Person'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
