type: object
description: >-
  Typed params for `organization.create_job_position` (`JobPositionQuery::Create`).
  The named OrgUnit must already exist. Write preflight requires non-empty `title`.
required:
- org_unit_id
- attributes
properties:
  org_unit_id:
    $ref: '#/components/schemas/Uuid'
  attributes:
    type: object
    required:
    - title
    properties:
      title:
        type: string
        minLength: 1
    additionalProperties: true
