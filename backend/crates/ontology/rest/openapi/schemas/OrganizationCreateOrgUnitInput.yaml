type: object
additionalProperties: false
description: >-
  Typed params for `organization.create_org_unit` (`OrgUnitQuery::Create`).
  Write preflight requires non-empty `name` and `kind` ∈ {site, department, team}.
required:
- attributes
properties:
  source:
    oneOf:
    - $ref: '#/components/schemas/OrgUnitSourceBinding'
    - type: 'null'
  attributes:
    type: object
    required:
    - name
    - kind
    properties:
      name:
        type: string
        minLength: 1
      kind:
        type: string
        enum:
        - site
        - department
        - team
      parent_id:
        oneOf:
        - $ref: '#/components/schemas/Uuid'
        - type: 'null'
    additionalProperties: true
