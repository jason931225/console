type: object
description: >-
  Canonical Employment head. Current get/list still return the *open* head
  (`employment_heads.valid_to IS NULL`). GET /api/v1/employments/{id}?as_of=
  reconstructs the slice effective at an RFC3339 instant using the same
  half-open predicate as ontology instance GET (`valid_from <= as_of <
  coalesce(valid_to, ∞)`); absent as_of = current open head. Closed (EXITED)
  windows are omitted by current get/list and by as_of at or after valid_to.
  `org_unit_id` / `job_position_id` are canonical UUIDs from the effective
  revision, not free-text team or title labels. `person_id` is the unique
  source-binding → person-binding path; ambiguous or unbound identities are
  null, never invented from `employee_id`. `appointed_on` is the head's
  opening `valid_from`. Write attributes also carry `company` and
  `employment_status` in {ACTIVE, EXITED, UNKNOWN}; those write fields are
  not this Head. The Head never includes phone, salary, bank_account, rrn,
  or base_pay. from/to range queries, corrections vs new slice, and delta
  transmission remain HOLD. Links, actions, and permissions are HOLD — not a
  Palantir property graph.
required:
- id
- appointed_on
- person_id
- org_unit_id
- job_position_id
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  person_id:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  org_unit_id:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  job_position_id:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  appointed_on:
    $ref: '#/components/schemas/Timestamp'
