type: object
description: An object-action preflight/execute request. Canonical DispatchTarget `params` `$ref` the typed input schemas; generic instance-revision actions keep a free-form object validated against the action's `params_schema` at runtime.
additionalProperties: false
required:
- object_type_id
properties:
  object_type_id:
    $ref: '#/components/schemas/Uuid'
  instance_id:
    $ref: '#/components/schemas/Uuid'
  title:
    type: string
  params:
    description: >-
      Typed params for the thirteen DispatchTarget action_keys, or a free-form
      object for generic instance-revision actions. The path `action_key` selects
      the codec; a caller-supplied `target` / `action_key` property is refused.
    anyOf:
    - $ref: '#/components/schemas/CompanyReviseInput'
    - $ref: '#/components/schemas/OrganizationCreateOrgUnitInput'
    - $ref: '#/components/schemas/OrganizationReviseOrgUnitInput'
    - $ref: '#/components/schemas/OrganizationCreateJobPositionInput'
    - $ref: '#/components/schemas/OrganizationReviseJobPositionInput'
    - $ref: '#/components/schemas/PeopleCreatePersonInput'
    - $ref: '#/components/schemas/PeopleRevisePersonInput'
    - $ref: '#/components/schemas/HrAppointInput'
    - $ref: '#/components/schemas/HrPromoteInput'
    - $ref: '#/components/schemas/HrTransferInput'
    - $ref: '#/components/schemas/PayrollCreateRunInput'
    - $ref: '#/components/schemas/PayrollSubmitRunInput'
    - $ref: '#/components/schemas/PayrollDecideRunInput'
    - type: object
      additionalProperties: true
      description: >-
        Non-DispatchTarget instance-revision params (`create`, `set_priority`,
        …). Runtime `params_schema` still fail-closes undeclared keys.
  reason:
    type: string
  valid_from:
    $ref: '#/components/schemas/Timestamp'
  checklist_all_acknowledged:
    type: boolean
  four_eyes_request_ref:
    $ref: '#/components/schemas/Uuid'
  command_id:
    $ref: '#/components/schemas/Uuid'
  expected_revision:
    type: integer
    format: int64
    minimum: 1
