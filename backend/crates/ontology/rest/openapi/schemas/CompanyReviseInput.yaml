type: object
additionalProperties: false
description: >-
  Typed params for `company.revise` (`CompanyQuery`). The tenant is `org_id` on
  the command envelope, not this bag. Preflight requires non-empty `legal_name`.
required:
- attributes
properties:
  attributes:
    type: object
    required:
    - legal_name
    properties:
      legal_name:
        type: string
        minLength: 1
      reg_no:
        type:
        - string
        - 'null'
    additionalProperties: true
