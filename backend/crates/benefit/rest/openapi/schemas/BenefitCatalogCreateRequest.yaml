type: object
description: Tenant and actor are derived from the verified bearer token; neither can be supplied by callers.
additionalProperties: false
required:
  - scope
  - category
  - name
  - coverageLabel
  - costLabel
properties:
  scope:
    $ref: '#/components/schemas/BenefitCatalogScope'
  category:
    type: string
    enum:
      - legal
      - extra
  name:
    type: string
    minLength: 1
  coverageLabel:
    type: string
    minLength: 1
  coveredCount:
    type:
      - integer
      - 'null'
  costLabel:
    type: string
    minLength: 1
  estimatedAnnualCostWon:
    type:
      - integer
      - 'null'
    format: int64
  employerRateBps:
    type:
      - integer
      - 'null'
  note:
    type:
      - string
      - 'null'
  legalBasis:
    type:
      - string
      - 'null'
  relatedDomain:
    type:
      - string
      - 'null'
  relatedObjectId:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  effectiveOn:
    type:
      - string
      - 'null'
    format: date
  retiresOn:
    type:
      - string
      - 'null'
    format: date
  displayOrder:
    type: integer
    default: 0
  metadata:
    type: object
    additionalProperties: true
  tiers:
    type: array
    items:
      $ref: '#/components/schemas/BenefitCatalogTier'
  conditions:
    type: array
    items:
      $ref: '#/components/schemas/BenefitCatalogCondition'
