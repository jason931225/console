type: object
additionalProperties: false
required:
  - object_type
  - object_id
properties:
  object_type:
    type: string
    enum:
      - benefit_catalog_item
  object_id:
    $ref: '#/components/schemas/Uuid'
  current_state:
    type:
      - string
      - 'null'
  legal_hold:
    type:
      - boolean
      - 'null'
  retention_until:
    type:
      - string
      - 'null'
    format: date-time
