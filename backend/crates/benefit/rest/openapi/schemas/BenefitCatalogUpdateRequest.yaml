type: object
description: Mutable catalog fields only; tenant, actor, identifiers, and lifecycle state are server-owned.
additionalProperties: false
properties:
  category:
    type: string
    enum:
      - legal
      - extra
  name:
    type: string
    minLength: 1
  scope:
    $ref: '#/components/schemas/BenefitCatalogScope'
  coverageLabel:
    type: string
  coveredCount:
    type:
      - integer
      - 'null'
  costLabel:
    type: string
  estimatedAnnualCostWon:
    type:
      - integer
      - 'null'
    format: int64
  employerRateBps:
    type:
      - integer
      - 'null'
  note:
    type:
      - string
      - 'null'
  legalBasis:
    type:
      - string
      - 'null'
  relatedDomain:
    type:
      - string
      - 'null'
  relatedObjectId:
    oneOf:
      - {$ref: '#/components/schemas/Uuid'}
      - {type: 'null'}
  effectiveOn:
    type:
      - string
      - 'null'
    format: date
  retiresOn:
    type:
      - string
      - 'null'
    format: date
  displayOrder:
    type: integer
  metadata:
    type: object
    additionalProperties: true
