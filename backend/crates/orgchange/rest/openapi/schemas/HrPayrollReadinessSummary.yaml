type: object
required:
- draft_runs
- blocked_runs
- calculation_enabled_runs
- active_close_runs
- draft_lines
- payroll_source_rows
- attendance_source_rows
- attendance_event_links
- attendance_material_refs
- gross_pay_source_lines
- net_pay_source_lines
properties:
  draft_runs:
    type: integer
    format: int64
    minimum: 0
  blocked_runs:
    type: integer
    format: int64
    minimum: 0
  calculation_enabled_runs:
    type: integer
    format: int64
    minimum: 0
  active_close_runs:
    type: integer
    format: int64
    minimum: 0
    description: Number of inspectable non-terminal payroll close runs.
  draft_lines:
    type: integer
    format: int64
    minimum: 0
  payroll_source_rows:
    type: integer
    format: int64
    minimum: 0
  attendance_source_rows:
    type: integer
    format: int64
    minimum: 0
  attendance_event_links:
    type: integer
    format: int64
    minimum: 0
  attendance_material_refs:
    type: integer
    format: int64
    minimum: 0
  gross_pay_source_lines:
    type: integer
    format: int64
    minimum: 0
  net_pay_source_lines:
    type: integer
    format: int64
    minimum: 0
  latest_status:
    type: string
  latest_source_label:
    type: string
  latest_period_start:
    type: string
  latest_period_end:
    type: string
  latest_updated_at:
    $ref: '#/components/schemas/Timestamp'
