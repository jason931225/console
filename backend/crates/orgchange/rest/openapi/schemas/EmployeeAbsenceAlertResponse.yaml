type: object
required:
- id
- employee_id
- employee_name
- company
- work_date
- source
- status
- severity
- audience_roles
- signal_payload
- notification_title
- notification_message
- link_href
- detected_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  employee_id:
    $ref: '#/components/schemas/Uuid'
  employee_name:
    type: string
  employee_number:
    type: string
  company:
    type: string
  org_unit:
    type: string
  worksite_name:
    type: string
  branch_id:
    $ref: '#/components/schemas/Uuid'
  branch_name:
    type: string
  work_date:
    type: string
  source:
    type: string
  status:
    type: string
  severity:
    type: string
  audience_roles:
    type: array
    items:
      type: string
  signal_payload:
    type: object
    additionalProperties: true
  notification_title:
    type: string
  notification_message:
    type: string
  link_href:
    type: string
  exit_case_id:
    $ref: '#/components/schemas/Uuid'
  detected_at:
    $ref: '#/components/schemas/Timestamp'
