type: object
required:
  - event_type
  - effective_date
  - comment
  - signoffs
properties:
  event_type:
    type: string
    enum:
      - ONBOARD
      - OFFBOARD
      - TERMINATE
      - TRANSFER
  to_status:
    oneOf:
      - {type: string, enum: [ACTIVE, EXITED, UNKNOWN]}
      - {type: 'null'}
  to_company:
    type:
      - string
      - 'null'
  to_org_unit:
    type:
      - string
      - 'null'
  to_position:
    type:
      - string
      - 'null'
  effective_date:
    type: string
    minLength: 1
  comment:
    type: string
    minLength: 1
  signoffs:
    $ref: '#/components/schemas/EmployeeLifecycleSignoffs'
