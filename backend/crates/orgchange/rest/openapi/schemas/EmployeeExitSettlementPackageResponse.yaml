type: object
required:
- id
- status
- missing_source_fields
- statutory_basis
- insurance_loss_payload
- approval_payload
- certification_status
- generated_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  status:
    type: string
  service_days:
    type: integer
    format: int32
  average_wage_period_start:
    type: string
  average_wage_period_end:
    type: string
  average_wage_calendar_days:
    type: integer
    format: int32
  average_wage_total_won:
    type: integer
    format: int64
  average_daily_wage_milliwon:
    type: integer
    format: int64
  severance_pay_won:
    type: integer
    format: int64
  monthly_ordinary_wage_won:
    type: integer
    format: int64
  ordinary_daily_wage_won:
    type: integer
    format: int64
  statutory_daily_wage_milliwon:
    type: integer
    format: int64
  missing_source_fields:
    type: array
    items:
      type: string
  statutory_basis:
    type: object
    additionalProperties: true
  insurance_loss_payload:
    type: object
    additionalProperties: true
  approval_payload:
    type: object
    additionalProperties: true
  certification_status:
    type: string
  generated_at:
    $ref: '#/components/schemas/Timestamp'
  submitted_by:
    $ref: '#/components/schemas/Uuid'
  submitted_at:
    $ref: '#/components/schemas/Timestamp'
