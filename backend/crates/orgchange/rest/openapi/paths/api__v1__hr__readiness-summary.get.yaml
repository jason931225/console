tags:
  - hr
operationId: getHrReadinessSummary
summary: Read HR data readiness counters
description: Returns import, payroll, annual-leave, and attendance readiness counters for org-wide HR operators without
  exposing raw workbook rows. `payroll.active_close_runs` counts only STAGED, BLOCKED_LEGAL_GATE,
  READY_FOR_REVIEW, and APPROVED payroll runs; terminal ISSUED and VOID history is excluded.
security:
- bearerAuth: []
responses:
  '200':
    description: HR readiness counters.
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/HrReadinessSummary'
  '401':
    $ref: '#/components/responses/Unauthorized'
  '403':
    $ref: '#/components/responses/Forbidden'
