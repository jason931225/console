type: object
description: >-
  Typed params for `payroll.decide_run` (`PayRunQuery::DecideRun`).
  `SUBMITTED → APPROVED|REJECTED`, refused when the decider is the submitter.
  Distinct from path-bound `DecidePayrollRunRequest` (run_id is in this bag).
  `payable` stays false. Payment execution remains HOLD.
required:
- run_id
- decision
properties:
  run_id:
    $ref: '#/components/schemas/Uuid'
  decision:
    type: string
    enum:
    - APPROVE
    - REJECT
  reason:
    type:
    - string
    - 'null'
    description: Required for REJECT at the lifecycle writer (blank reason is 422).
