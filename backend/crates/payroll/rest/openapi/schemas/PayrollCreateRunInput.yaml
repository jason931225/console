type: object
additionalProperties: false
description: >-
  Typed params for `payroll.create_run` (`PayRunQuery::CreateRun`). Stages a
  draft under a caller-chosen source label. `payable` is not an input; stored
  calculations stay false. Payment execution remains HOLD.
required:
- run_id
- period_start
- period_end
properties:
  run_id:
    $ref: '#/components/schemas/Uuid'
  period_start:
    type: string
    format: date
  period_end:
    type: string
    format: date
  connector:
    type:
    - string
    - 'null'
  job:
    type:
    - string
    - 'null'
