type: object
required:
- id
- actor
- action
- target_type
- target_id
- branch_id
- before_snap
- after_snap
- ip
- user_agent
- auth_method
- device
- classification_badges
- anomaly
- reason
- trace_id
- span_id
- occurred_at
properties:
  id:
    $ref: '#/components/schemas/Uuid'
  actor:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  action:
    type: string
  target_type:
    type: string
  target_id:
    type: string
  branch_id:
    oneOf:
    - $ref: '#/components/schemas/Uuid'
    - type: 'null'
  before_snap:
    type:
    - object
    - 'null'
    additionalProperties: true
  after_snap:
    type:
    - object
    - 'null'
    additionalProperties: true
  ip:
    type:
    - string
    - 'null'
  user_agent:
    type:
    - string
    - 'null'
  auth_method:
    type:
    - string
    - 'null'
  device:
    type:
    - string
    - 'null'
  classification_badges:
    type:
    - array
    - 'null'
    items:
      type: string
  anomaly:
    type:
    - boolean
    - 'null'
  reason:
    type:
    - string
    - 'null'
  trace_id:
    type: string
  span_id:
    type: string
  occurred_at:
    $ref: '#/components/schemas/Timestamp'
