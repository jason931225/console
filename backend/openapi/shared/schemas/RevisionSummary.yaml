type: object
required:
  - id
  - instance_id
  - version
  - attributes
  - valid_from
  - prev_hash
  - row_hash
properties:
  id:
    type: string
    format: uuid
  instance_id:
    type: string
    format: uuid
  version:
    type: integer
    format: int64
  attributes:
    type: object
    additionalProperties: true
  valid_from:
    type: string
    format: date-time
  valid_to:
    type:
      - string
      - 'null'
    format: date-time
  action_type_id:
    type:
      - string
      - 'null'
    format: uuid
  actor:
    type:
      - string
      - 'null'
    format: uuid
  reason:
    type:
      - string
      - 'null'
  prev_hash:
    type: string
  row_hash:
    type: string
