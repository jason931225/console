apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: console-db
  namespace: console
spec:
  # Deployment context: live oci-guest base. This cluster is intentionally one
  # CNPG instance on one Always Free A1 node; it has restore/PITR artifacts but no
  # automatic database failover. The ADR-0024 on-prem-ha overlay patches this to
  # >=3 instances plus replicated storage without changing the live OCI posture.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  primaryUpdateStrategy: unsupervised
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  # OCI-specific Barman/S3 compatibility workaround. Do not treat these env vars
  # as universal: the on-prem-ha self-hosted S3 endpoint must be validated on its
  # own before copying checksum behavior.
  # boto3 >= 1.36 (bundled in barman-cloud's S3 client) defaults to flexible
  # checksums sent via AWS *chunked encoding* on PutObject. OCI Object Storage's
  # S3-compatible API rejects that with "NotImplemented: AWS chunked encoding not
  # supported", which broke EVERY WAL archive + base backup (continuous archiving
  # stuck False, daily backup failing). Forcing checksum calc/validation to
  # when_required disables the default chunked upload so OCI accepts it. The
  # barman-cloud subprocess runs in the instance container and inherits these.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  postgresql:
    parameters:
      # Deliberate sizing for the shared A1 node rather than container defaults.
      shared_buffers: 256MB
      effective_cache_size: 768MB
      work_mem: 16MB
      max_connections: "60"
  bootstrap:
    initdb:
      database: console
      # console_app OWNS every table and is used ONLY to run schema migrations
      # (out of band, via the console-db-app secret). The running application does
      # NOT connect as it — see managed.roles.console_rt below.
      owner: console_app
  # console_rt is the least-privilege RUNTIME role the app/worker connect as. It
  # owns nothing, is NOSUPERUSER + NOBYPASSRLS (so Postgres RLS applies to it),
  # and gets only the GRANTs migration 0031 hands out. CNPG attaches LOGIN + the
  # password from console-db-rt here; the role attributes are also pinned in 0031 so
  # they hold regardless of creation order.
  managed:
    roles:
      - name: console_rt
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        inherit: true
        passwordSecret:
          name: console-db-rt
  # Continuous WAL archiving + base backups via the Barman Cloud Plugin.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: console-backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: console-backups
  namespace: console
spec:
  # FINITE retention, set 2026-07-31. Supersedes the indefinite setting of
  # 2026-06-23, which read: "with no retentionPolicy, barman-cloud never prunes
  # base backups / WALs, so PITR reaches back to the first backup forever."
  #
  # WHY THIS IS NOT MERELY A STORAGE DECISION. ADR-0037 records that a DELETE is
  # not destruction while an archive can reconstruct the row. Research into how
  # European controllers and the hyperscalers handle this found that the accepted
  # position is NOT "deferred deletion" on its own — it is erase-from-live PLUS a
  # finite, written, scheduled expiry, PLUS an erasure log kept outside the backup
  # and re-applied after any restore. The finiteness is the load-bearing part: a
  # deferral with no endpoint is not a deferral. An unbounded archive therefore
  # sits outside that position rather than behind it.
  #
  # 90d is this file's own previously documented intent ("re-add e.g.
  # retentionPolicy: 90d"). It is adopted here because it is FINITE, which is the
  # property that matters; the specific number trades disaster recovery against
  # erasure-completion horizon and is a decision for the owner and for privacy
  # counsel, not for this comment. Shortening it is the lever if a faster erasure
  # horizon is required. ADR-0015 requires RPO <= 5min and RTO <= 1h, which
  # constrain recovery SPEED and imply nothing about window LENGTH.
  #
  # SAFE TO SET NOW: verified 2026-07-31 that this manifest is not deployed — no
  # CNPG cluster in the tenancy declares a backup, the barmancloud ObjectStore CRD
  # is not installed, and the `console` namespace does not exist. There are no
  # existing backups for this policy to prune. Setting it after a production
  # archive exists would be a destructive change; setting it now is free.
  #
  # This asserts NO Korean legal conclusion. PIPA and its 시행령 do not address
  # backups at all, and no Korean equivalent of the European position is
  # established. Every Korea control remains HOLD.
  retentionPolicy: "90d"
  configuration:
    # OCI Object Storage, S3-compatible API, Chuncheon. NAMESPACE = the tenancy
    # object-storage namespace (oci os ns get); bucket pre-created out of band.
    # The on-prem-ha overlay replaces endpoint/credentials with the selected
    # self-hosted S3-compatible service and OpenBao/ESO-projected secrets.
    destinationPath: s3://mnt-db-backups/
    endpointURL: https://axdotp9iv3ua.compat.objectstorage.ap-chuncheon-1.oraclecloud.com
    s3Credentials:
      accessKeyId:
        name: oci-objectstore-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: oci-objectstore-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 1 # one WAL PUT stream — keeps requests under the 50k/mo free cap
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: console-db-daily
  namespace: console
spec:
  # 6-field cron (CNPG uses seconds). 03:00 UTC = 12:00 KST daily base backup;
  # continuous WAL archiving gives point-in-time recovery between base backups.
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: console-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
