name: Console authority bootstrap

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# This workflow is deliberately target-branch-only: no secrets, cache, npm,
# or checkout of PR executable content precedes the authenticated graph check.
permissions:
  contents: read

jobs:
  authenticate-console-authority:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected target code only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Verify C/T authority train before candidate execution
        env:
          HOME: ${{ runner.temp }}/hostile-home
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/console/verify-console-pr-authority-bootstrap.mjs \
          --pr-number "$PR_NUMBER" \
          --head "$PR_HEAD_SHA" \
          --merge "$PR_MERGE_SHA" \
          --base "$PR_BASE_REF"

  bind-merged-console-authority-squash:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected pre-merge base code only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind merged squash tree to the authenticated authority train
        env:
          HOME: ${{ runner.temp }}/hostile-home
          AUTHORITY_TIP_SHA: ${{ github.event.pull_request.head.sha }}
          SQUASH_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RECEIPT_PATH: ${{ runner.temp }}/console-squash-binding.json
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          test "$(git -c core.hooksPath=/dev/null rev-parse HEAD)" = "$SQUASH_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$SQUASH_SHA^"
          node scripts/console/verify-console-pr-authority-bootstrap.mjs squash-binding \
          --head "$AUTHORITY_TIP_SHA" \
          --squash "$SQUASH_SHA" \
          --base "$PR_BASE_REF" > "$RECEIPT_PATH"
      - name: Upload squash binding receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-squash-binding-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/console-squash-binding.json
          if-no-files-found: error
