name: Console authority bootstrap

on:
  pull_request_target:
    branches:
      - main

# This workflow is deliberately target-branch-only: no secrets, cache, npm,
# or checkout of PR executable content precedes the authenticated graph check.
permissions:
  contents: read

jobs:
  authenticate-console-authority:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected target code only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Verify C/T authority train before candidate execution
        env:
          HOME: ${{ runner.temp }}/hostile-home
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/console/verify-console-pr-authority-bootstrap.mjs \
          --pr-number "$PR_NUMBER" \
          --head "$PR_HEAD_SHA" \
          --merge "$PR_MERGE_SHA" \
          --base "$PR_BASE_REF"
