        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: ADR governance tests
        if: ${{ !cancelled() }}
        run: npm run test:adrs

      - name: Executed-tests ratchet — a test file must have a path from a workflow step
