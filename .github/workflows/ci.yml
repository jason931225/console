name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Required checks must be created for every relevant push and pull request. A
  # `paths` filter leaves required contexts Pending forever when candidate-controlled
  # action, trust, security, or tool configuration changes outside an allowlist.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs only for PRs. On main, every push must run CI to
  # completion: image-release is triggered by this completed successful CI run
  # for the exact SHA, so a rapid merge train must not cancel main CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight — foundation and lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Derive exact console C/T/M train
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          CONSOLE_SYNTHETIC_MERGE_SHA="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$CONSOLE_SYNTHETIC_MERGE_SHA"
          CONSOLE_AUTHORITY_TIP_SHA="$(git rev-parse "$CONSOLE_SYNTHETIC_MERGE_SHA^2")"
          CONSOLE_CANDIDATE_SHA="$(git rev-parse "$CONSOLE_AUTHORITY_TIP_SHA^")"
          {
            printf 'CONSOLE_CANDIDATE_SHA=%s\n' "$CONSOLE_CANDIDATE_SHA"
            printf 'CONSOLE_AUTHORITY_TIP_SHA=%s\n' "$CONSOLE_AUTHORITY_TIP_SHA"
            printf 'CONSOLE_SYNTHETIC_MERGE_SHA=%s\n' "$CONSOLE_SYNTHETIC_MERGE_SHA"
          } >> "$GITHUB_ENV"

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Install Rust toolchain for Cargo.lock consistency
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Cheap Buck2 generated-face admission
        run: tools/buck/preflight.sh

      - name: Foundation gate contract
        run: npm run check:foundation-gates

      - name: Reasoning lens contract regression
        run: node --test scripts/check-reasoning-lens-contract.test.mjs

      - name: Reasoning lens changed-record admission
        shell: bash
        env:
          REASONING_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REASONING_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -n "$REASONING_PR_BASE_SHA"
              node scripts/check-reasoning-lens-contract.mjs --changed-since "$REASONING_PR_BASE_SHA"
              ;;
            push)
              case "$GITHUB_REF_TYPE" in
                branch)
                  test -n "$REASONING_PUSH_BEFORE_SHA"
                  if [[ "$REASONING_PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                    printf '%s\n' 'push.before is all-zero; running structural reasoning-lens validation'
                    node scripts/check-reasoning-lens-contract.mjs
                  else
                    node scripts/check-reasoning-lens-contract.mjs --changed-since "$REASONING_PUSH_BEFORE_SHA"
                  fi
                  ;;
                tag)
                  node scripts/check-reasoning-lens-contract.mjs
                  ;;
                *)
                  printf 'unsupported push ref type: %s\n' "$GITHUB_REF_TYPE" >&2
                  exit 2
                  ;;
              esac
              ;;
            workflow_dispatch)
              node scripts/check-reasoning-lens-contract.mjs
              ;;
            *)
              printf 'unsupported reasoning-lens event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac

      - name: Console truth-ledger exact-M admission
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run check:console-truth-ledger

      - name: Console fanout planner exact-M admission
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/console/plan-fanout.mjs --candidate "$CONSOLE_CANDIDATE_SHA" --authority-tip "$CONSOLE_AUTHORITY_TIP_SHA" --synthetic-merge "$CONSOLE_SYNTHETIC_MERGE_SHA"

      - name: CI preflight contract tests
        run: node --test scripts/check-ci-preflight.test.mjs

      - name: Console route inventory regression
        run: node --test scripts/console/route-inventory.test.mjs

      - name: Console authority-train regression
        run: node --test scripts/console/verify-console-authority-train.test.mjs

      - name: Console PR authority bootstrap regression
        run: node --test scripts/console/verify-console-pr-authority-bootstrap.test.mjs scripts/console/release-please-bot-candidate.test.mjs

      - name: Executed-tests baseline set regression
        run: npm run test:executed-tests-baseline

      - name: Local CI mirror contract
        run: node --test scripts/verify.test.mjs

      - name: Console truth-ledger validator exact-M regression
        run: node --test scripts/console/validate-console-truth-ledger.test.mjs

      - name: Console fanout planner exact-M regression
        run: node --test scripts/console/plan-fanout.test.mjs

      - name: Buck PostgreSQL environment wrapper regression
        run: tools/buck/run_test_with_postgres_env.test.sh

      - name: Buck disposable PostgreSQL harness regression
        run: tools/buck/test_needs_postgres.test.sh

      - name: CI preflight contract
        run: npm run check:ci-preflight

      - name: Canonical npm lockfile
        run: npm run check:package-lock

      - name: Cargo.lock consistency
        run: cargo metadata --manifest-path backend/Cargo.toml --locked --format-version=1 >/dev/null

      # Moved here from repo-gates, which has npm and no Rust: the ratchet now
      # resolves `cargo metadata` as well as the BUCK graph, so it has to run
      # where cargo does. The step above it is `cargo metadata` on the same
      # manifest, and preflight is the only job carrying both toolchains.
      - name: Executed-tests ratchet — a test binary must have a path from a workflow step
        run: npm run check:executed-tests
      - name: JavaScript test reachability ratchet
        run: npm run check:js-test-reachability
      - name: JavaScript test reachability unit tests
        run: npm run test:js-test-reachability

      - name: Lane fan-out harness preflight
        run: node .claude/workflows/lane-fanout.test.mjs
      - name: Workflow test-runner credential literals
        run: npm run check:test-credentials

  domain-unit:
    name: Domain crates — unit tests
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          # One shared entry, not one per job. rust-cache keys on job name by
          # default, so these two maintained separate near-duplicate copies of the
          # same workspace and evicted each other out of the 10GB LRU budget.
          shared-key: backend-cargo
          cache-all-crates: "true"
          # RESTORE-ONLY. This job compiles three crates; `backend` compiles the whole
          # workspace. Under a shared key without this, whichever finishes first wins —
          # so a three-crate target dir could become the cache `backend` then restores.
          # Sharing a key without deciding who writes it is the same poisoning bug as
          # letting a Buck2 job save a directory it never populated, one level down.
          save-if: false

      - name: Domain crate unit tests
        # cargo, not buck2. MEASURED 2026-07-31 on this crate: buck2 cold 118.4s
        # (176 commands, `cached: 0`) versus cargo cold 6.5s. Buck2 is not slower
        # by nature — its warm build is 0.17s — but its warm state CANNOT cross a
        # CI run boundary: the action cache lives in the daemon's in-memory graph,
        # not portably in buck-out. Proven by tarring buck-out, deleting it,
        # restoring it and rebuilding: still `cached: 0`, all 176 commands re-ran.
        # So every buck2 job here was a cold build, every run, with no cache to
        # restore. cargo's target/ does survive, via rust-cache below.
        #
        # --lib is load-bearing on the first command: several of these crates also
        # carry tests/ suites needing PostgreSQL — payroll_lifecycle_rls_as_runtime_role,
        # audit_chain_rls, and authz's policy.rs, each verified to panic in sqlx's test
        # harness without a database. Those belong to postgres-domain-reachability.
        #
        # The later commands name the integration files that need NO database, verified
        # by execution one at a time. Seven crates were added on 2026-07-31 because
        # check:executed-tests measured that 287 of 314 Rust test files reach no workflow
        # step at all, and these were the audit-relevant ones needing no database:
        # the audit chain, the policy and governance domains, the ADR-0021 Cedar
        # strangler's readiness and legacy-only-observation cases, and the 위치정보법
        # location-consent FSM — the only consent mechanism in the repository.
        # 98 tests that previously executed nowhere.
        #
        # The adapter crate is here because its 12 pure #[test] cases — the
        # parse_release_gate half that decides what a stored gate record may parse
        # INTO — ran in NO workflow. The domain half decides whether a parsed gate
        # is satisfied; without the adapter half the release gate is half-proven.
        # They need no database (zero #[sqlx::test]), so they belong in this job.
        # Runs the SAME 15 tests as the retired Buck2 target, verified by count.
        # --locked so a drifted Cargo.lock fails rather than silently resolving.
        #
        # The last six were added on 2026-08-02, and they are here because
        # check:executed-tests could not see them until that same change. It asked
        # whether src/lib.rs itself carried #[cfg(test)], and these crates keep
        # every one of theirs in src/<module>.rs, so their lib binaries were not
        # even in the population that can be reported dark. 61 tests that executed
        # nowhere, all pure, zero #[sqlx::test] — among them workflow/runtime's
        # `unknown_policy_fails_closed` and `delegated_finalize_denies_when_legacy_guard_denies`,
        # and platform/auth's two WebAuthn step-up replay-binding cases. The seventh
        # crate the same measurement exposed, platform/db, is 9 #[sqlx::test] and
        # needs a database, so it is named in executed-tests-baseline.json instead.
        run: |
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml --lib \
            -p console-support-domain -p console-payroll-domain -p console-payroll-adapter-postgres \
            -p console-attendance-application -p console-compliance-domain -p console-governance-domain \
            -p console-platform-audit-chain -p console-platform-authz \
            -p console-policy-application -p console-policy-domain \
            -p console-action-inbox-application -p console-attendance-domain -p console-benefit-application \
            -p console-benefit-domain -p console-comms-application -p console-comms-domain \
            -p console-dispatch-application -p console-dispatch-domain -p console-docs-application \
            -p console-docs-domain -p console-equipment-domain -p console-erp-domain \
            -p console-evaluation-application -p console-evaluation-domain -p console-finance-gl-domain -p console-inspection-domain -p console-messenger-domain -p console-registry-domain -p console-workorder-domain \
            -p console-identity-domain -p console-inbox-application -p console-inbox-domain \
            -p console-inventory-domain -p console-leave-domain -p console-logistics-domain \
            -p console-messenger-application -p console-notices-domain -p console-notifications-domain \
            -p console-ontology-application -p console-ontology-domain -p console-orgchange-domain \
            -p console-recruiting-application -p console-recruiting-domain -p console-reporting-application \
            -p console-reporting-domain -p console-sales-domain -p console-support-application \
            -p console-todos-domain -p console-workflow-domain -p console-workorder-application \
            -p console-analytics-quant-service -p console-attendance-adapter-postgres -p console-attendance-rest \
            -p console-benefit-rest -p console-comms-adapter-imap -p console-comms-adapter-mox \
            -p console-comms-adapter-smtp -p console-comms-credential-cipher -p console-comms-mailbox \
            -p console-comms-rest -p console-compliance-rest -p console-consulting-rest \
            -p console-dispatch-rest -p console-docs-adapter-postgres -p console-docs-rest \
            -p console-evaluation-adapter-postgres -p console-facilities-rest -p console-financial-rest \
            -p console-gate-dev-auth-absence -p console-gate-iac-tier -p console-gate-layer-boundary \
            -p console-gate-tenant-isolation -p console-gate-vendor-lockin -p console-identity-rest \
            -p console-inventory-adapter-postgres -p console-inventory-rest -p console-leave-adapter-postgres \
            -p console-leave-rest -p console-ontology-adapter-postgres -p console-ontology-rest \
            -p console-payroll-rest -p console-platform-email -p console-platform-jobs \
            -p console-platform-push -p console-platform-realtime -p console-platform-request-context \
            -p console-production-rest -p console-reporting-adapter-postgres -p console-support-adapter-postgres \
            -p console-kernel-core -p console-registry-rest -p console-reporting-rest \
            -p console-workflow-runtime-adapter-postgres -p console-workorder-rest \
            -p console-financial-domain -p console-identity-application -p console-integrity \
            -p console-platform-auth -p console-platform-authz-rest -p console-workflow-runtime \
            -p console-logistics-rest -p console-ontology-canonical-domain \
            -p console-gate-writer-ownership
          # Doc tests, same step so no new step name has to be declared anywhere.
          # `compile_fail` doctests are the only artifact that can hold a NEGATIVE
          # type-boundary claim ("this must not compile"), and they execute nowhere
          # unless --doc is invoked explicitly.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            --doc -p console-kernel-core
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-attendance-application --test attendance_policy
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-compliance-domain --test location_consent_fsm --test location_ping_policy
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-authz --test cedar_pbac_readiness_cases --test cedar_pbac_legacy_only_observe_and_record
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-attendance-domain --test range_and_history
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-contracts --test compose
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-todos-rest --test openapi_fragment
          # ONE -p PER INVOCATION whenever --test is used. Two packages and two --test names on
          # a single line is ambiguous to any reader that pairs them positionally, and
          # check-executed-tests.mjs pairs them as a CROSS PRODUCT — 2x2 candidates where only
          # 2 are real. That produces a FALSE POSITIVE the moment a name exists in both crates,
          # reporting a test as executed when it is not. Under-reporting darkness is the one
          # direction that measurement tool must never fail in, so the ambiguity is removed at
          # the source rather than parsed around.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-financial-domain --test quote_and_residual
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-registry-domain --test equipment
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-messenger-domain --test mentions --test object_code_refs --test parity --test thread_kind
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-workorder-domain --test approval_and_assignment --test serde_roundtrips \
            --test settlement_fsm --test workorder_fsm
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-auth --test jwt_es256 --test jwt_verifier --test well_known
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-excel --test template_fidelity --test template_fill_engine
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-platform-realtime --test hub --test notify_payload
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-app --test config --test dev_seed_notification_links --test openslo_files \
            --test well_known --test workbench_api
          # The writer-ownership gate's mutation suite. It lives here and not in
          # the backend job's Buck2 mutation-suite step because 3 of its 41 tests
          # read THIS repository -- the whole backend crate tree, and
          # ops/postgres-reconcile-topology.sh -- which a Buck2 action does not
          # materialize. A real checkout is the requirement, and this job has one.
          SQLX_OFFLINE=true cargo test --locked --manifest-path backend/Cargo.toml \
            -p console-gate-writer-ownership --test gate_detects_violation

  # PostgreSQL reachability facets (S1 + S2 domain split). Package partition via --shard-id.
  # Do NOT put the load-bearing branch-protection display name on these jobs
  # (matrix/facet renames un-require the check). Aggregator below keeps it.
  postgres-reachability-app:
    name: Test PostgreSQL — app
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Free runner disk for PostgreSQL cargo tests
        uses: ./.github/actions/free-runner-disk
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          shared-key: backend-cargo
          cache-all-crates: "true"
          save-if: false
      - name: Run disposable PostgreSQL integration targets
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id app --num-threads=1

  postgres-reachability-platform:
    name: Test PostgreSQL — platform
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Free runner disk for PostgreSQL cargo tests
        uses: ./.github/actions/free-runner-disk
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          shared-key: backend-cargo
          cache-all-crates: "true"
          save-if: false
      - name: Run disposable PostgreSQL integration targets
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id platform --num-threads=1

  postgres-reachability-ontology:
    name: Test PostgreSQL — ontology
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Free runner disk for PostgreSQL cargo tests
        uses: ./.github/actions/free-runner-disk
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          shared-key: backend-cargo
          cache-all-crates: "true"
          save-if: false
      - name: Run disposable PostgreSQL integration targets
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id ontology --num-threads=1

  postgres-reachability-domain-a:
    name: Test PostgreSQL — domain adapters A
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Free runner disk for PostgreSQL cargo tests
        uses: ./.github/actions/free-runner-disk
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          shared-key: backend-cargo
          cache-all-crates: "true"
          save-if: false
      - name: Run disposable PostgreSQL integration targets
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id domain-a --num-threads=1

  postgres-reachability-domain-b:
    name: Test PostgreSQL — domain adapters B
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Free runner disk for PostgreSQL cargo tests
        uses: ./.github/actions/free-runner-disk
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"
      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          shared-key: backend-cargo
          cache-all-crates: "true"
          save-if: false
      - name: Run disposable PostgreSQL integration targets
        run: |
          tools/ci/cargo_needs_postgres.sh --workflow-only --shard-id domain-b --num-threads=1

  postgres-domain-reachability:
    # REQUIRED as of 2026-07-29: a red here blocks the merge. It was promoted
    # once it had reported green on main at least once — a required context that
    # has never reported blocks every merge, so the order matters.
    #
    # The display name below is now LOAD-BEARING: branch protection matches the
    # required context on that literal string, so renaming this job without
    # updating the protection contexts in the same change silently un-requires
    # it and restores the false-green this comment used to describe.
    #
    # S1/S2: aggregator only. Facet jobs run the suite; this job fails closed if
    # any facet is not success. Do not matrix this display name.
    name: Dispatch, attendance and ontology — disposable PostgreSQL reachability
    needs:
      - postgres-reachability-app
      - postgres-reachability-platform
      - postgres-reachability-ontology
      - postgres-reachability-domain-a
      - postgres-reachability-domain-b
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all PostgreSQL reachability facets
        run: |
          test "${{ needs.postgres-reachability-app.result }}" = success &&
          test "${{ needs.postgres-reachability-platform.result }}" = success &&
          test "${{ needs.postgres-reachability-ontology.result }}" = success &&
          test "${{ needs.postgres-reachability-domain-a.result }}" = success &&
          test "${{ needs.postgres-reachability-domain-b.result }}" = success

  company-conformance:
    # Required generic ontology instance-engine regression. Its twelve scenario
    # ids and five controls exercise useful engine behavior through both REST and
    # in-process drivers, so the suite remains blocking.
    #
    # This is not the current Company/HR product target: all five fixtures are
    # instance-backed, Person is absent, and the suite proves no projected owning
    # port or single-writer boundary. Twice it also could not distinguish a
    # correct mechanism from a wrong one; adapter-postgres mechanism tests cover
    # those blind spots. A green result must not dispatch the projected fan-out.
    name: Company conformance — generic-engine regression
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for PostgreSQL Buck2 tests
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"


      - name: Company conformance against disposable PostgreSQL
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:company-conformance-postgres

  generated-face-authority:
    # This status is the complete generated-face closure required by policy.
    # It becomes merge-enforced only after the live GitHub ruleset admits this
    # exact status; cheap `preflight` intentionally defers expensive faces.
    name: Generated faces — full required drift authority
    runs-on: macos-latest
    needs: preflight
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Install lock-pinned Reindeer Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=third-party/rust/reindeer/upstream.lock
          source third-party/rust/reindeer/upstream.lock
          rustup toolchain install "$REINDEER_TOOLCHAIN" --profile minimal

      - name: Install workspace dependencies
        run: npm ci

      - name: Full generated-face closure
        run: tools/buck/preflight.sh --full-generated-faces

  backend:
    name: Backend — fmt / clippy / test / gates
    runs-on: ubuntu-latest
    needs: preflight
    # Serial integration execution avoids cluster-global role mutation races.
    #
    # NOTE: the "full workspace" this number was originally sized for no longer
    # runs here. Migration 0196 admits only `console_buck_admin` (with
    # `console.sqlx_test_bootstrap` armed) for applying migrations, so the workspace
    # run was dropped rather than re-identified. The topology step below now
    # provisions that role, so restoring the sweep is a matter of pointing it at
    # $CONSOLE_BUCK_ADMIN_DATABASE_URL -- see H-8 in
    # docs/program/false-green-gate-holes.md. Deliberately not done here: it
    # will surface a genuine backlog and belongs in its own change.
    #
    # 90 rather than 45 because the harness performs 13 per-invocation Docker
    # bring-ups (2 Apalis + 11 guarded regressions), each with container start
    # and topology reconcile, and this branch carries considerably more code
    # than main.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: console_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/console_ci
      # Job-level so every step (including the gate binaries, which didn't
      # previously set it themselves) compiles query! macros against the
      # committed .sqlx cache instead of an unmigrated DB. Cheap insurance;
      # steps below still set it explicitly too, which is a harmless no-op.
      SQLX_OFFLINE: "true"
      # Backend CI compiles the full workspace, tests, and custom gates on the
      # standard GitHub runner. Keep artifacts lean so unrelated UI-only PRs do
      # not fail from runner disk exhaustion while preserving the same checks.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: ../tools/buck/install_dotslash.sh

      - name: Free runner disk for Rust backend
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # rust-toolchain.toml drives the exact version; this step just
          # ensures rustup is available and honours the file.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies + build artifacts
        # rust-cache keys on Cargo.lock + rustc + job, caches registry/git deps
        # and prunes stale crates from target/ (so the cache does not grow
        # unbounded on every Cargo.lock change the way a raw target/ cache does).
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend
          # One shared entry, not one per job. rust-cache keys on job name by
          # default, so these two maintained separate near-duplicate copies of the
          # same workspace and evicted each other out of the 10GB LRU budget.
          shared-key: backend-cargo
          cache-all-crates: "true"
          # The ONLY writer. `backend` runs clippy --all-targets over the whole
          # workspace, a strict superset of every other cargo job, so its target dir
          # is the one worth sharing. Saving only from main keeps PR branches from
          # publishing a cache shaped by their own diff.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: clippy -D warnings
        run: SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings
      - name: Layer-boundary gate
        run: cargo run -p console-gate-layer-boundary

      - name: Audit-coverage gate
        run: cargo run -p console-gate-audit-coverage

      - name: Migration-safety gate
        run: cargo run -p console-gate-migration-safety

      - name: Tenant-isolation gate
        run: cargo run -p console-gate-tenant-isolation

      - name: PII-no-logs gate
        run: cargo run -p console-gate-pii-no-logs

      - name: RLS-arming gate
        run: cargo run -p console-gate-rls-arming

      - name: Dev-auth-absence gate
        run: cargo run -p console-gate-dev-auth-absence

      - name: IaC tier-discipline gate
        run: cargo run -p console-gate-iac-tier

      # An authorization branch must come from the RESOURCE. Deriving it from
      # `principal.branch_scope` (`All => BranchId::new()`,
      # `Branches(b) => b.iter().next()/.any()`) makes `authorize`'s
      # `branch_scope.allows(resource_branch)` check a tautology on BOTH arms, so
      # the branch dimension disappears silently. That pattern reached 18
      # production helpers, one of which documented it as correct; a doc comment
      # is what already failed. This gate also fails if it walked zero .rs files.
      #
      # DEFENCE IN DEPTH, NOT A CONTROL. It greps: a fabrication one function
      # away, a non-literal pick (`.first()`, `.nth(0)`, a `for` loop) and any
      # `BranchScope::` import alias all scan clean. The three blind spots are
      # named in the module doc and in docs/CI-GATES.md; the control that closes
      # them is a `ResourceBranch` newtype, queued separately.
      - name: Fabricated-branch gate
        run: cargo run -p console-gate-fabricated-branch

      - name: Personal-data-classification gate
        run: cargo run -p console-gate-personal-data-classification

      # The STATIC half of writer ownership: at most one production crate may
      # hold DML against each canonical-object table. Best-effort by
      # construction — the load-bearing half is the database capability census
      # in ops/postgres-reconcile-topology.sh, executed by
      # //backend/ci/gates/writer-ownership:console-gate-writer-ownership-itest-census_executes_against_postgres
      # through the disposable-PostgreSQL cargo harness. Two residual shapes are
      # pinned by `known_residual_` tests; bead console-tai.1 carries the total fix.
      - name: Writer-ownership gate
        run: cargo run -p console-gate-writer-ownership

      # The eleven `cargo run -p console-gate-*` steps above only prove the gates
      # exit 0 against THIS tree. A gate whose scan root no longer resolves --
      # e.g. after the 2026-07-28 deletion moved or emptied a directory it walks
      # -- also exits 0, so "green" cannot be distinguished from "scanned
      # nothing". These are the only artifacts that plant a violation in a
      # throwaway tree and assert the gate rejects it; without this step they
      # were compiled by clippy --all-targets and never executed.
      #
      # `env -u DATABASE_URL` matches the other hermetic Buck2 steps: none of
      # these eight targets touches a database (audit-coverage carries a stale
      # `needs-postgres` label only because gen_first_party.py keys on the
      # literal "sqlx" appearing in its fixture strings -- the crate has zero
      # dependencies). Placed before the DB-heavy steps so a de-fanged gate
      # fails the job in minutes rather than at the end.
      #
      # console-gate-writer-ownership is DELIBERATELY ABSENT from this list, and
      # adding it here fails the job. MEASURED 2026-08-09: under Buck2 only a
      # target's own mapped_srcs are materialized, so 3 of the 41 tests in its
      # gate_detects_violation die on a path that is not there --
      # `measured_tip_has_exactly_the_ratcheted_dual_writers` walks the whole
      # backend crate tree, and two more read ops/postgres-reconcile-topology.sh
      # ("No such file or directory (os error 2)"). Unlike its siblings, that
      # suite asserts about THIS repository and not only about throwaway trees,
      # so it runs from a real checkout under `domain-unit` instead.
      # Its database half runs in the PostgreSQL reachability facets via
      # tools/ci/postgres-cargo-map.json.
      - name: Buck2 CI-gate mutation suites — every gate proven to still reject
        working-directory: .
        run: |
          env -u DATABASE_URL tools/buck2 test \
            //backend/ci/gates/audit-coverage:console-gate-audit-coverage-itest-gate_detects_violation \
            //backend/ci/gates/fabricated-branch:console-gate-fabricated-branch-itest-gate_detects_violation \
            //backend/ci/gates/fabricated-branch:console-gate-fabricated-branch-unit \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary-itest-gate_detects_violation \
            //backend/ci/gates/migration-safety:console-gate-migration-safety-itest-gate_detects_violation \
            //backend/ci/gates/personal-data-classification:console-gate-personal-data-classification-itest-gate_detects_violation \
            //backend/ci/gates/pii-no-logs:console-gate-pii-no-logs-itest-gate_detects_violation \
            //backend/ci/gates/vendor-lockin:console-gate-vendor-lockin-itest-gate_detects_violation

      # Migration 0165 fails closed unless the portable seven-role topology
      # already exists. Reconcile it before any database test applies the
      # migration, using the distinct service administrator only for this
      # cluster-scoped bootstrap.
      - name: PR 473 migration operational contract tests
        working-directory: .
        run: python3 scripts/check-pr473-migration-operational.test.py -v

      - name: Reconcile portable PostgreSQL role topology
        run: |
          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            /usr/local/bin/postgres-reconcile-topology

          # The Apalis adapter contract intentionally mutates only its own
          # dedicated database while proving direct console_app/console_rt logins. The
          # job-level DATABASE_URL stays on the cluster administrator for the
          # boot smoke; it can no longer serve migration-applying tests, which
          # migration 0196 restricts to the console_buck_admin harness identity.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS console_apalis_contract WITH (FORCE)" \
            -c "CREATE DATABASE console_apalis_contract OWNER console_app"

          # Migration 0196 restricts migration application to a superuser named
          # exactly `console_buck_admin` with `console.sqlx_test_bootstrap` armed (and a
          # test database it owns). The `postgres` service account therefore
          # cannot apply a single migration, which silently breaks every direct
          # `cargo test` that relies on `#[sqlx::test]`. Provision that identity
          # here so those suites can run; the password crosses through a
          # mode-0600 file, never argv.
          BUCK_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf "CREATE ROLE console_buck_admin SUPERUSER LOGIN PASSWORD '%s';\n" \
            "$BUCK_ADMIN_PASSWORD" > "$RUNNER_TEMP/buck-admin.sql"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$RUNNER_TEMP/buck-admin.sql:/buck-admin.sql:ro" \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /buck-admin.sql
          rm -f "$RUNNER_TEMP/buck-admin.sql"

          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$RT_PASSWORD"
          echo "::add-mask::$BUCK_ADMIN_PASSWORD"
          {
            echo "CONSOLE_BUCK_ADMIN_DATABASE_URL=postgres://console_buck_admin:${BUCK_ADMIN_PASSWORD}@localhost:5432/console_ci?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1"
            echo "CONSOLE_APALIS_OWNER_DATABASE_URL=postgres://console_app:${APP_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_RUNTIME_DATABASE_URL=postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_ADMIN_DATABASE_URL=postgres://postgres:postgres@localhost:5432/console_apalis_contract"
          } >> "$GITHUB_ENV"

      - name: PR 473 migration operational gate
        working-directory: .
        # SQLX_OFFLINE=true so the query! macros compile against the committed
        # .sqlx cache (the documented contract — see crates/platform/db/src/lib.rs)
        # rather than the unmigrated CI service DB. The #[sqlx::test] runtime
        # tests still use DATABASE_URL to create their own per-test databases.
        # Without this, a Cargo.lock change busts the build cache and the macros
        # re-check online against a schema-less DB ("audit_events does not exist").
        # The wrapper isolates the 11 migration regressions for exact one-test
        # runtime-result validation. It does NOT preserve a full workspace run --
        # migration 0196 restricts migration application to the console_buck_admin
        # harness identity, so the service DB cannot host one (H-8 in
        # docs/program/false-green-gate-holes.md). Every test binary remains
        # serial because topology upgrade tests mutate cluster-global roles.
        run: npm run check:pr473-migration-operational

      # Boot smoke: the real console-app binary, migrate then serve mode, against
      # this job's fresh service DB — catches route-panic-at-boot regressions
      # (e.g. a bad router/state wiring) that unit/integration tests never
      # exercise because they never call `serve()`. Mirrors the minimal env
      # image-release.yml's release-probe job uses to boot the shipped image;
      # a throwaway keypair is fine, this only proves the app comes up.
      - name: Boot smoke — migrate + serve + /readyz
        run: |
          set -e
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out /tmp/smoke-priv.pem
          openssl ec -in /tmp/smoke-priv.pem -pubout -out /tmp/smoke-pub.pem

          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4 /usr/local/bin/postgres-reconcile-topology

          OWNER_DATABASE_URL="postgres://console_app:${APP_PASSWORD}@localhost:5432/console_ci"
          RUNTIME_DATABASE_URL="postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_ci"
          LEAVE_COMMAND_DATABASE_URL="postgres://console_leave_cmd:${LEAVE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          ONTOLOGY_COMMAND_DATABASE_URL="postgres://console_ontology_cmd:${ONTOLOGY_COMMAND_PASSWORD}@localhost:5432/console_ci"
          PLATFORM_FORCE_COMMAND_DATABASE_URL="postgres://console_platform_force_cmd:${PLATFORM_FORCE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          export DATABASE_URL="$OWNER_DATABASE_URL"

          CONSOLE_APP_ROLE=migrate SQLX_OFFLINE=true cargo run -q -p console-app
          SQLX_OFFLINE=true cargo test --locked \
            -p console-gate-tenant-isolation \
            --test owner_only_acl_postgres18 -- \
            --include-ignored --test-threads=1

          CONSOLE_APP_ROLE=api \
          DATABASE_URL="$RUNTIME_DATABASE_URL" \
          LEAVE_COMMAND_DATABASE_URL="$LEAVE_COMMAND_DATABASE_URL" \
          ONTOLOGY_COMMAND_DATABASE_URL="$ONTOLOGY_COMMAND_DATABASE_URL" \
          PLATFORM_FORCE_COMMAND_DATABASE_URL="$PLATFORM_FORCE_COMMAND_DATABASE_URL" \
          CONSOLE_HTTP_ADDR=127.0.0.1:8092 \
          CONSOLE_JWT_ISSUER=ci-boot-smoke \
          CONSOLE_JWT_AUDIENCE=ci-boot-smoke \
          CONSOLE_JWT_PRIVATE_KEY_PEM="$(cat /tmp/smoke-priv.pem)" \
          CONSOLE_JWT_PUBLIC_KEY_PEM="$(cat /tmp/smoke-pub.pem)" \
          CONSOLE_WEBAUTHN_RP_ID=localhost \
          CONSOLE_WEBAUTHN_RP_ORIGIN=http://localhost \
          CONSOLE_COOKIE_SECURE=false \
          SQLX_OFFLINE=true \
          cargo run -q -p console-app &
          BOOT_PID=$!

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8092/readyz; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$BOOT_PID" 2>/dev/null || true
          wait "$BOOT_PID" 2>/dev/null || true

          if [ "$ready" != "1" ]; then
            echo "::error::console-app never became ready in boot smoke"
            exit 1
          fi

      - name: Buck2 dev-auth feature PostgreSQL suites
        working-directory: .
        # `dev-auth` is NOT in default features (proven above). These exact
        # feature-sensitive auth-rest and provisioning binaries run through
        # generator-owned Buck targets and the disposable role-topology harness;
        # direct Cargo would bypass that contract.
        # That harness uses the migration-0196-authorized `console_buck_admin`
        # identity with `console.sqlx_test_bootstrap` armed, so the suites reach
        # their assertions instead of failing during migration application.
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:auth-rest-dev-auth-inline-postgres \
            //tools/buck:auth-rest-dev-auth-session-postgres \
            //tools/buck:auth-rest-dev-auth-group-admin-postgres \
            //tools/buck:provisioning-dev-principal-upsert-race-postgres

      # The residual lowering that decides which instance rows a caller may see
      # lives in this crate, and its 44 unit tests — including
      # `unconditional_forbid_collapses_whole_filter_to_false`,
      # `untranslatable_term_collapses_whole_filter_never_drops` and
      # `unsafe_attributes_column_denies_all` — executed NOWHERE in CI. The
      # target resolved and built; no workflow referenced it. That is the
      # false-green class this repo has already shipped: a correct test that
      # never runs. It also carries the dotted-stable-key refusal matrix, the
      # only evidence that widening `is_stable_key` for dots did not widen the
      # Cedar injection boundary on any other axis.
      - name: Buck2 platform-authz unit suite
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/crates/platform/authz:console-platform-authz-unit

      - name: Buck2 console-app unit suite
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/app:console-app-unit

      # openapi.yaml is the single source of truth for the REST surface and is
      # include_str!-ed into the binary. This suite is the only thing that
      # inventories every mounted route against it. It existed but was never
      # invoked by CI, so drift between the router and the spec could land
      # unnoticed; `check:platform-contract-drift` does not cover this (it only
      # regexes /api/platform/ paths). The byte-compare of the served document
      # against the file was deleted: include_str! made it tautological.
      - name: Buck2 console-app OpenAPI drift suite
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/app:console-app-itest-openapi_drift

      - name: Buck2 console-app inline PostgreSQL suites
        working-directory: .
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:app-inline-postgres \
            //tools/buck:app-dev-auth-persona-guard-postgres

  dev-up-smoke:
    name: dev-up.mjs smoke — compose deps + migrate + /readyz
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: dev-up compose contract unit test
        run: node --test scripts/dev-up-compose.test.mjs

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for Rust backend
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"


      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: PostgreSQL topology integration regression
        run: ops/postgres-topology.integration.test.sh

      - name: dev-up bootstrap (compose deps + migrate + backend readyz)
        # macOS/Windows GH-hosted runners cannot run Linux containers reliably,
        # so this smoke test is ubuntu-only; the other OSes' acceptance is the
        # `doctor` self-check (documented deviation from the plan's "macos
        # runner" wording, per W2.5 reviewer note).
        run: node scripts/dev-up.mjs bootstrap

      - name: Confirm /readyz reachable
        run: curl -fsS "http://127.0.0.1:${CONSOLE_DEV_HTTP_PORT:-8090}/readyz"

      - name: dev-up down
        if: always()
        run: node scripts/dev-up.mjs down

