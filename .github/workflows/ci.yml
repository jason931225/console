name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # GitHub Actions does not evaluate `paths` for tag pushes; release tags
    # therefore run the full ADR-0009/0012 CI gate regardless of changed files.
    paths:
      - "backend/**"
      - "backend/openapi/**"
      - "deploy/**"
      - "docs/decisions/**"
      - "docs/program/**"
      - "docs/CI-GATES.md"
      - "docs/benchmarks/**"
      - "docs/specs/**"
      - "docs/ENTERPRISE-READINESS.md"
      - "docs/GO-LIVE-CHECKLIST.md"
      - "docs/i18n.md"
      - "docs/parity-checklist.md"
      - "docs/release/**"
      - "ops/**"
      - "scripts/**"
      - "tools/buck/**"
      - "tools/buck2"
      - "toolchains/**"
      - "third-party/rust/**"
      - "BUCK"
      - ".buckconfig"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "backend/**"
      - "backend/openapi/**"
      - "deploy/**"
      - "docs/decisions/**"
      - "docs/program/**"
      - "docs/CI-GATES.md"
      - "docs/benchmarks/**"
      - "docs/specs/**"
      - "docs/ENTERPRISE-READINESS.md"
      - "docs/GO-LIVE-CHECKLIST.md"
      - "docs/i18n.md"
      - "docs/parity-checklist.md"
      - "docs/release/**"
      - "ops/**"
      - "scripts/**"
      - "tools/buck/**"
      - "tools/buck2"
      - "toolchains/**"
      - "third-party/rust/**"
      - "BUCK"
      - ".buckconfig"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs only for PRs. On main, every push must run CI to
  # completion: image-release is triggered by this completed successful CI run
  # for the exact SHA, so a rapid merge train must not cancel main CI.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: CI preflight — foundation and lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Derive exact console C/T/M train
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          CONSOLE_SYNTHETIC_MERGE_SHA="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$CONSOLE_SYNTHETIC_MERGE_SHA"
          CONSOLE_AUTHORITY_TIP_SHA="$(git rev-parse "$CONSOLE_SYNTHETIC_MERGE_SHA^2")"
          CONSOLE_CANDIDATE_SHA="$(git rev-parse "$CONSOLE_AUTHORITY_TIP_SHA^")"
          {
            printf 'CONSOLE_CANDIDATE_SHA=%s\n' "$CONSOLE_CANDIDATE_SHA"
            printf 'CONSOLE_AUTHORITY_TIP_SHA=%s\n' "$CONSOLE_AUTHORITY_TIP_SHA"
            printf 'CONSOLE_SYNTHETIC_MERGE_SHA=%s\n' "$CONSOLE_SYNTHETIC_MERGE_SHA"
          } >> "$GITHUB_ENV"

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Install Rust toolchain for Cargo.lock consistency
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Cheap Buck2 generated-face admission
        run: tools/buck/preflight.sh

      - name: Foundation gate contract
        run: npm run check:foundation-gates

      - name: Console truth-ledger exact-M admission
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run check:console-truth-ledger

      - name: Console fanout planner exact-M admission
        if: ${{ github.event_name == 'pull_request' }}
        run: node scripts/console/plan-fanout.mjs --candidate "$CONSOLE_CANDIDATE_SHA" --authority-tip "$CONSOLE_AUTHORITY_TIP_SHA" --synthetic-merge "$CONSOLE_SYNTHETIC_MERGE_SHA"

      - name: CI preflight contract tests
        run: node --test scripts/check-ci-preflight.test.mjs

      - name: Console route inventory regression
        run: node --test scripts/console/route-inventory.test.mjs

      - name: Console authority-train regression
        run: node --test scripts/console/verify-console-authority-train.test.mjs

      - name: Console truth-ledger validator exact-M regression
        run: node --test scripts/console/validate-console-truth-ledger.test.mjs

      - name: Console fanout planner exact-M regression
        run: node --test scripts/console/plan-fanout.test.mjs

      - name: Buck PostgreSQL environment wrapper regression
        run: tools/buck/run_test_with_postgres_env.test.sh

      - name: Buck disposable PostgreSQL harness regression
        run: tools/buck/test_needs_postgres.test.sh

      - name: CI preflight contract
        run: npm run check:ci-preflight

      - name: Canonical npm lockfile
        run: npm run check:package-lock

      - name: Cargo.lock consistency
        run: cargo metadata --manifest-path backend/Cargo.toml --locked --format-version=1 >/dev/null

  support-domain-unit:
    name: Support domain — Buck2 unit reachability
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for support Buck2 unit
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Support domain unit target
        run: tools/buck2 test //backend/crates/support/domain:console-support-domain-unit

  postgres-domain-reachability:
    name: Dispatch and attendance — disposable PostgreSQL reachability
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for PostgreSQL Buck2 tests
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Serialized disposable PostgreSQL integration targets
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:dispatch-p1-postgres \
            //tools/buck:attendance-cancel-substitution-postgres \
            //tools/buck:attendance-concurrency-postgres

  generated-face-authority:
    # This status is the complete generated-face closure required by policy.
    # It becomes merge-enforced only after the live GitHub ruleset admits this
    # exact status; cheap `preflight` intentionally defers expensive faces.
    name: Generated faces — full required drift authority
    runs-on: macos-latest
    needs: preflight
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Install lock-pinned Reindeer Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=third-party/rust/reindeer/upstream.lock
          source third-party/rust/reindeer/upstream.lock
          rustup toolchain install "$REINDEER_TOOLCHAIN" --profile minimal

      - name: Install workspace dependencies
        run: npm ci

      - name: Full generated-face closure
        run: tools/buck/preflight.sh --full-generated-faces

  backend:
    name: Backend — fmt / clippy / test / gates
    runs-on: ubuntu-latest
    needs: preflight
    # Serial integration execution avoids cluster-global role mutation races.
    #
    # NOTE: the "full workspace" this number was originally sized for no longer
    # runs here. Migration 0196 admits only `console_buck_admin` (with
    # `console.sqlx_test_bootstrap` armed) for applying migrations, so the workspace
    # run was dropped rather than re-identified. The topology step below now
    # provisions that role, so restoring the sweep is a matter of pointing it at
    # $CONSOLE_BUCK_ADMIN_DATABASE_URL -- see H-8 in
    # docs/program/false-green-gate-holes.md. Deliberately not done here: it
    # will surface a genuine backlog and belongs in its own change.
    #
    # 90 rather than 45 because the harness performs 13 per-invocation Docker
    # bring-ups (2 Apalis + 11 guarded regressions), each with container start
    # and topology reconcile, and this branch carries considerably more code
    # than main.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: console_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/console_ci
      # Job-level so every step (including the gate binaries, which didn't
      # previously set it themselves) compiles query! macros against the
      # committed .sqlx cache instead of an unmigrated DB. Cheap insurance;
      # steps below still set it explicitly too, which is a harmless no-op.
      SQLX_OFFLINE: "true"
      # Backend CI compiles the full workspace, tests, and custom gates on the
      # standard GitHub runner. Keep artifacts lean so unrelated UI-only PRs do
      # not fail from runner disk exhaustion while preserving the same checks.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned DotSlash runtime
        run: ../tools/buck/install_dotslash.sh

      - name: Free runner disk for Rust backend
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # rust-toolchain.toml drives the exact version; this step just
          # ensures rustup is available and honours the file.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies + build artifacts
        # rust-cache keys on Cargo.lock + rustc + job, caches registry/git deps
        # and prunes stale crates from target/ (so the cache does not grow
        # unbounded on every Cargo.lock change the way a raw target/ cache does).
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: clippy -D warnings
        run: SQLX_OFFLINE=true cargo clippy --all-targets -- -D warnings
      - name: Layer-boundary gate
        run: cargo run -p console-gate-layer-boundary

      - name: Audit-coverage gate
        run: cargo run -p console-gate-audit-coverage

      - name: Migration-safety gate
        run: cargo run -p console-gate-migration-safety

      - name: Tenant-isolation gate
        run: cargo run -p console-gate-tenant-isolation

      - name: PII-no-logs gate
        run: cargo run -p console-gate-pii-no-logs

      - name: RLS-arming gate
        run: cargo run -p console-gate-rls-arming

      - name: Dev-auth-absence gate
        run: cargo run -p console-gate-dev-auth-absence

      - name: IaC tier-discipline gate
        run: cargo run -p console-gate-iac-tier
      # Migration 0165 fails closed unless the portable seven-role topology
      # already exists. Reconcile it before any database test applies the
      # migration, using the distinct service administrator only for this
      # cluster-scoped bootstrap.
      - name: PR 473 migration operational contract tests
        working-directory: .
        run: python3 scripts/check-pr473-migration-operational.test.py -v

      - name: Reconcile portable PostgreSQL role topology
        run: |
          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            /usr/local/bin/postgres-reconcile-topology

          # The Apalis adapter contract intentionally mutates only its own
          # dedicated database while proving direct console_app/console_rt logins. The
          # job-level DATABASE_URL stays on the cluster administrator for the
          # boot smoke; it can no longer serve migration-applying tests, which
          # migration 0196 restricts to the console_buck_admin harness identity.
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS console_apalis_contract WITH (FORCE)" \
            -c "CREATE DATABASE console_apalis_contract OWNER console_app"

          # Migration 0196 restricts migration application to a superuser named
          # exactly `console_buck_admin` with `console.sqlx_test_bootstrap` armed (and a
          # test database it owns). The `postgres` service account therefore
          # cannot apply a single migration, which silently breaks every direct
          # `cargo test` that relies on `#[sqlx::test]`. Provision that identity
          # here so those suites can run; the password crosses through a
          # mode-0600 file, never argv.
          BUCK_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          umask 077
          printf "CREATE ROLE console_buck_admin SUPERUSER LOGIN PASSWORD '%s';\n" \
            "$BUCK_ADMIN_PASSWORD" > "$RUNNER_TEMP/buck-admin.sql"
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -v "$RUNNER_TEMP/buck-admin.sql:/buck-admin.sql:ro" \
            --entrypoint psql \
            postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /buck-admin.sql
          rm -f "$RUNNER_TEMP/buck-admin.sql"

          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$RT_PASSWORD"
          echo "::add-mask::$BUCK_ADMIN_PASSWORD"
          {
            echo "CONSOLE_BUCK_ADMIN_DATABASE_URL=postgres://console_buck_admin:${BUCK_ADMIN_PASSWORD}@localhost:5432/console_ci?options%5Bconsole.sqlx_test_bootstrap%5D=buck-sqlx-superuser-v1"
            echo "CONSOLE_APALIS_OWNER_DATABASE_URL=postgres://console_app:${APP_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_RUNTIME_DATABASE_URL=postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_apalis_contract"
            echo "CONSOLE_APALIS_ADMIN_DATABASE_URL=postgres://postgres:postgres@localhost:5432/console_apalis_contract"
          } >> "$GITHUB_ENV"

      - name: PR 473 migration operational gate
        working-directory: .
        # SQLX_OFFLINE=true so the query! macros compile against the committed
        # .sqlx cache (the documented contract — see crates/platform/db/src/lib.rs)
        # rather than the unmigrated CI service DB. The #[sqlx::test] runtime
        # tests still use DATABASE_URL to create their own per-test databases.
        # Without this, a Cargo.lock change busts the build cache and the macros
        # re-check online against a schema-less DB ("audit_events does not exist").
        # The wrapper isolates the 11 migration regressions for exact one-test
        # runtime-result validation. It does NOT preserve a full workspace run --
        # migration 0196 restricts migration application to the console_buck_admin
        # harness identity, so the service DB cannot host one (H-8 in
        # docs/program/false-green-gate-holes.md). Every test binary remains
        # serial because topology upgrade tests mutate cluster-global roles.
        run: npm run check:pr473-migration-operational

      # Boot smoke: the real console-app binary, migrate then serve mode, against
      # this job's fresh service DB — catches route-panic-at-boot regressions
      # (e.g. a bad router/state wiring) that unit/integration tests never
      # exercise because they never call `serve()`. Mirrors the minimal env
      # image-release.yml's release-probe job uses to boot the shipped image;
      # a throwaway keypair is fine, this only proves the app comes up.
      - name: Boot smoke — migrate + serve + /readyz
        run: |
          set -e
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out /tmp/smoke-priv.pem
          openssl ec -in /tmp/smoke-priv.pem -pubout -out /tmp/smoke-pub.pem

          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_ci \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4 /usr/local/bin/postgres-reconcile-topology

          OWNER_DATABASE_URL="postgres://console_app:${APP_PASSWORD}@localhost:5432/console_ci"
          RUNTIME_DATABASE_URL="postgres://console_rt:${RT_PASSWORD}@localhost:5432/console_ci"
          LEAVE_COMMAND_DATABASE_URL="postgres://console_leave_cmd:${LEAVE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          ONTOLOGY_COMMAND_DATABASE_URL="postgres://console_ontology_cmd:${ONTOLOGY_COMMAND_PASSWORD}@localhost:5432/console_ci"
          PLATFORM_FORCE_COMMAND_DATABASE_URL="postgres://console_platform_force_cmd:${PLATFORM_FORCE_COMMAND_PASSWORD}@localhost:5432/console_ci"
          export DATABASE_URL="$OWNER_DATABASE_URL"

          CONSOLE_APP_ROLE=migrate SQLX_OFFLINE=true cargo run -q -p console-app
          SQLX_OFFLINE=true cargo test --locked \
            -p console-gate-tenant-isolation \
            --test owner_only_acl_postgres18 -- \
            --include-ignored --test-threads=1

          CONSOLE_APP_ROLE=api \
          DATABASE_URL="$RUNTIME_DATABASE_URL" \
          LEAVE_COMMAND_DATABASE_URL="$LEAVE_COMMAND_DATABASE_URL" \
          ONTOLOGY_COMMAND_DATABASE_URL="$ONTOLOGY_COMMAND_DATABASE_URL" \
          PLATFORM_FORCE_COMMAND_DATABASE_URL="$PLATFORM_FORCE_COMMAND_DATABASE_URL" \
          CONSOLE_HTTP_ADDR=127.0.0.1:8092 \
          CONSOLE_JWT_ISSUER=ci-boot-smoke \
          CONSOLE_JWT_AUDIENCE=ci-boot-smoke \
          CONSOLE_JWT_PRIVATE_KEY_PEM="$(cat /tmp/smoke-priv.pem)" \
          CONSOLE_JWT_PUBLIC_KEY_PEM="$(cat /tmp/smoke-pub.pem)" \
          CONSOLE_WEBAUTHN_RP_ID=localhost \
          CONSOLE_WEBAUTHN_RP_ORIGIN=http://localhost \
          CONSOLE_COOKIE_SECURE=false \
          SQLX_OFFLINE=true \
          cargo run -q -p console-app &
          BOOT_PID=$!

          ready=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8092/readyz; then
              ready=1
              break
            fi
            sleep 2
          done

          kill "$BOOT_PID" 2>/dev/null || true
          wait "$BOOT_PID" 2>/dev/null || true

          if [ "$ready" != "1" ]; then
            echo "::error::console-app never became ready in boot smoke"
            exit 1
          fi

      - name: Buck2 dev-auth feature PostgreSQL suites
        working-directory: .
        # `dev-auth` is NOT in default features (proven above). These exact
        # feature-sensitive auth-rest and provisioning binaries run through
        # generator-owned Buck targets and the disposable role-topology harness;
        # direct Cargo would bypass that contract.
        # That harness uses the migration-0196-authorized `console_buck_admin`
        # identity with `console.sqlx_test_bootstrap` armed, so the suites reach
        # their assertions instead of failing during migration application.
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:auth-rest-dev-auth-inline-postgres \
            //tools/buck:auth-rest-dev-auth-session-postgres \
            //tools/buck:auth-rest-dev-auth-group-admin-postgres \
            //tools/buck:provisioning-dev-principal-upsert-race-postgres

      - name: Buck2 console-app unit suite
        working-directory: .
        run: env -u DATABASE_URL tools/buck2 test //backend/app:console-app-unit

      - name: Buck2 console-app inline PostgreSQL suites
        working-directory: .
        run: |
          tools/buck/test_needs_postgres.sh --num-threads=1 \
            //tools/buck:app-inline-postgres \
            //tools/buck:app-dev-auth-persona-guard-postgres

  dev-up-smoke:
    name: dev-up.mjs smoke — compose deps + migrate + /readyz
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: dev-up compose contract unit test
        run: node --test scripts/dev-up-compose.test.mjs

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for Rust backend
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Rust dependencies + build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: PostgreSQL topology integration regression
        run: ops/postgres-topology.integration.test.sh

      - name: dev-up bootstrap (compose deps + migrate + backend readyz)
        # macOS/Windows GH-hosted runners cannot run Linux containers reliably,
        # so this smoke test is ubuntu-only; the other OSes' acceptance is the
        # `doctor` self-check (documented deviation from the plan's "macos
        # runner" wording, per W2.5 reviewer note).
        run: node scripts/dev-up.mjs bootstrap

      - name: Confirm /readyz reachable
        run: curl -fsS "http://127.0.0.1:${CONSOLE_DEV_HTTP_PORT:-8090}/readyz"

      - name: dev-up down
        if: always()
        run: node scripts/dev-up.mjs down

  repo-gates:
    name: Repo gates — ADR / foundation / domain maturity
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: ADR governance tests
        if: ${{ !cancelled() }}
        run: npm run test:adrs

      - name: ADR governance gate
        if: ${{ !cancelled() }}
        run: npm run check:adrs

      - name: Foundation gate contract
        if: ${{ !cancelled() }}
        run: npm run check:foundation-gates

      - name: Canonical npm lockfile
        if: ${{ !cancelled() }}
        run: npm run check:package-lock

      - name: Shared text gate unit tests
        if: ${{ !cancelled() }}
        run: npm run test:text-gate
      - name: G004 identity group org people policy foundation gate
        if: ${{ !cancelled() }}
        run: npm run check:g004-identity-foundation

      - name: G005 workflow approval Work Hub lifecycle gate
        if: ${{ !cancelled() }}
        run: npm run check:g005-workflow-lifecycle

      - name: Workflow runtime spine gate
        if: ${{ !cancelled() }}
        run: npm run check:workflow-runtime-spine

      - name: Workflow runtime M2 strangler dark-landing gate
        if: ${{ !cancelled() }}
        run: npm run check:workflow-runtime-m2-strangler

      - name: Workflow runtime M2 Cedar-guard observe-and-record gate
        if: ${{ !cancelled() }}
        run: npm run check:workflow-runtime-m2-cedar-guards

      - name: Workflow runtime M2 flag-ON runtime gate
        if: ${{ !cancelled() }}
        run: npm run check:workflow-runtime-m2-runtime

      - name: Workflow runtime M2 outbox-drainer transactional-idempotency gate
        if: ${{ !cancelled() }}
        run: npm run check:workflow-runtime-m2-drainer

      - name: G006 asset equipment dispatch lifecycle gate
        if: ${{ !cancelled() }}
