  api-contract:
    name: API contract — app-served OpenAPI
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: console_contract
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTRACT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/console_contract
      # This job builds console-app before comparing the app-served OpenAPI and
      # running the generated-client round-trip. Match the backend job's lean
      # Cargo artifacts so the standard runner does not exhaust disk on cache
      # misses.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pinned DotSlash runtime
        run: tools/buck/install_dotslash.sh

      - name: Free runner disk for API contract
        uses: ./.github/actions/free-runner-disk

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.97.1"


      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install client tooling
        run: npm ci

      - name: OpenAPI app-served drift gate
        if: ${{ !cancelled() }}
        run: npm run check:openapi-app

      - name: Capture Buck2-built app for contract test
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # check:openapi-app is the sole Buck2 producer for this handoff.
          console_app_bin="${GITHUB_WORKSPACE}/.tmp/buck2/api-contract/console-app"
          test -x "${console_app_bin}"
          printf 'CONSOLE_APP_BIN=%s\n' "${console_app_bin}" >> "${GITHUB_ENV}"

      - name: Employee import replay contract
        if: ${{ !cancelled() }}
        run: npm run test:employee-import-contract

      - name: Ontology write precondition contract
        if: ${{ !cancelled() }}
        run: npm run test:ontology-write-precondition

  kubernetes-manifests:
    name: Kubernetes manifests — render / hardening / NetworkPolicy preflight
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Install kubectl (for kustomize renderer)
        env:
          KUBECTL_VERSION: "v1.36.2"
        run: |
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      # scripts/check-networkpolicy-enforcement.sh guards its 16 static
      # assertions (no NodePort/LoadBalancer/hostPort, no public SMTP, a
      # default-deny egress policy for mox, ...) behind an available kustomize
      # renderer. This job installed kubectl only, so the whole proof was
      # skipped and the gate reported green while asserting nothing.
      # Installing the real binary makes those assertions run under every shape
      # of that script. Note it renders with upstream kustomize while
      # scripts/render-k8s-manifests.sh renders with `kubectl kustomize`: two
      # independent renderers over the same prod overlay, which is stronger
      # evidence than one, and a divergence between them is itself a finding.
      - name: Install kustomize (NetworkPolicy static render proof)
        env:
          KUSTOMIZE_VERSION: "v5.8.1"
          KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
        run: |
          curl -fsSLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" kustomize
          kustomize version

      - name: Governed command-database DARK wiring regression
        run: node --test scripts/check-command-database-wiring.test.mjs

      - name: Render manifests and NetworkPolicy enforcement preflight
        if: ${{ !cancelled() }}
        # Generic CI has no production kubeconfig, so the live readback runs in
        # warning mode here. Real deployment validation must set
        # CONSOLE_NETWORKPOLICY_PREFLIGHT=require against the target cluster.
        env:
          CONSOLE_NETWORKPOLICY_PREFLIGHT: warn
        run: npm run check:k8s

      - name: Production hardening contract
        if: ${{ !cancelled() }}
        run: npm run check:production-hardening

      - name: Production hardening regression tests
        if: ${{ !cancelled() }}
        run: npm run test:production-hardening
