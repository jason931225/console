# Non-required canary. Proves the warm-cache path degrades safely.
#
# It is deliberately NOT a required context and is not referenced by
# check-ci-preflight or check-foundation-gates: a shared build cache must never
# be able to fail Required CI. Buck2 hard-fails when a configured CAS is
# unreachable, so the fallback this workflow exercises is load-bearing.
name: CAS canary

on:
  pull_request:
  workflow_dispatch:
    inputs:
      endpoint:
        description: host:port to probe
        required: false
        default: 127.0.0.1:50051

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallback:
    name: Warm cache degrades to local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # No CAS is reachable from a hosted runner today, and fork pull_request
      # events hold no credentials by policy. Both must land on the cold path.
      - name: Preflight
        id: cas
        uses: ./.github/actions/cas-warm
        with:
          endpoint: ${{ github.event.inputs.endpoint || '127.0.0.1:50051' }}
          role: reader

      - name: Assert the contract
        env:
          CAS_UP: ${{ steps.cas.outputs.cas-up }}
          FLAGS: ${{ steps.cas.outputs.flags }}
        run: |
          echo "cas_up=${CAS_UP} flags='${FLAGS}'"
          if [ "$CAS_UP" = "1" ]; then
            [ -z "$FLAGS" ] || { echo "reachable cache must not pass --no-remote-cache"; exit 1; }
            [ -f .buckconfig.local ] || { echo "reachable cache must leave RE config in place"; exit 1; }
            echo "OK: warm path selected"
          else
            [ "$FLAGS" = "--no-remote-cache" ] || { echo "unreachable cache must fall back"; exit 1; }
            [ ! -f .buckconfig.local ] || { echo "unreachable cache must not leave RE config"; exit 1; }
            echo "OK: cold path selected, build may proceed locally"
          fi

      - name: Preflight never fails the job
        run: echo "reached the step after preflight — a cache outage cannot break this workflow"

  seed:
    name: Seed — fill the in-runner cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
        id: cas
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: writer }
      - name: Build (expect cold)
        run: |
          buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 | tail -6
      - name: Store size before save
        run: du -sh ~/nativelink-cas || true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/nativelink-cas
          key: nativelink-cas-linux-x64-${{ github.run_id }}

  reuse:
    name: Reuse — a second runner hits it
    needs: [seed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { persist-credentials: false }
      - uses: ./.github/actions/buck2-setup
      - uses: ./.github/actions/cas-inrunner
        id: cas
      - uses: ./.github/actions/cas-warm
        id: warm
        with: { endpoint: "127.0.0.1:50051", role: writer }
      - name: Build and require cache hits
        run: |
          set -o pipefail
          buck2 --isolation-dir ci build --config-file infra/ci/buckconfig/warm-cache.buckconfig \
            ${{ steps.warm.outputs.flags }} \
            //backend/ci/gates/layer-boundary:console-gate-layer-boundary --console=simple 2>&1 | tee /tmp/b.log | tail -6
          echo "--- verdict ---"
          if grep -qE 'Cache hits: (100|[1-9][0-9])%' /tmp/b.log; then
            echo "OK: a second runner reused the first runner's work"
          else
            echo "NO REUSE: this is the cached:0-across-runners failure, still present"
            grep -E 'Cache hits|Commands:' /tmp/b.log || true
            exit 1
          fi

  prune:
    name: Prune — leave the shared cache budget as we found it
    needs: [seed, reuse]
    if: always() && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete this run's CAS cache entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # cache-hygiene.yml holds the repo to an 8 GiB soft budget and hard-fails
          # above it. A canary must not spend that budget, so it cleans up after
          # itself rather than waiting for the daily protocol.
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            -q '.actions_caches[] | select(.key|startswith("nativelink-cas-")) | "\(.id) \(.key) \(.size_in_bytes)"' \
          | while read -r id key size; do
              echo "deleting $key ($((size/1048576)) MiB)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || true
            done
          gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" \
            -q '"remaining usage: \(.active_caches_size_in_bytes/1073741824*100|round/100) GiB across \(.active_caches_count) caches"'
