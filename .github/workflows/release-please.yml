name: Release Please

# Enforced semantic versioning. Conventional-commit history on main drives an
# automatically maintained release PR; merging it bumps the version, updates the
# changelog, and pushes a vX.Y.Z tag. Image publication remains a separate
# exact-main-CI workflow_run boundary in image-release.yml. That wake-up is not
# release authority: publication additionally requires an immutable live release,
# its exact lightweight tag, and exact successful CI + Security runs.
#
# The protected action always uses GITHUB_TOKEN so the release PR is created by
# github-actions[bot]. RELEASE_PLEASE_TOKEN is transport-only: after protected
# code binds the action output to exact generated bytes, it force-pushes the
# deterministic custody rewrite so pull_request checks are scheduled. Never
# pass the PAT to the release action or checkout. See docs/CI-GATES.md.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Bound protected API and transport work, including a connection that
    # stalls inside one of the finite post-push polling reads.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.converge.outputs.pr_number }}
      head_sha: ${{ steps.converge.outputs.head_sha }}
      parent_sha: ${{ steps.converge.outputs.parent_sha }}
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # CHANGELOG.md is first-party manifest evidence. Release Please cannot update
      # docs/documentation-manifest.seed.json + docs/documentation-index.json, so the
      # release tip would fail check:doc-manifest / check:doc-links. Converge those
      # custody blobs onto the same bot tip (fail-closed path allow-list).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: ${{ steps.release.outputs.pr }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: "24.16.0"
      - name: Converge documentation custody on release-please tip
        id: converge
        if: ${{ steps.release.outputs.pr }}
        env:
          RELEASE_PLEASE_PR: ${{ steps.release.outputs.pr }}
          # Protected code strips this PAT from non-transport child environments
          # and uses a private askpass only for the final force-with-lease.
          CONSOLE_RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # All GitHub API reads retain the protected workflow identity.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/console/converge-release-please-doc-custody.mjs

  # This native job record is the minimal release-authority receipt. The
  # pull_request_target gate polls the exact protected workflow run and exact
  # job name; no generic status/check context can impersonate that provenance.
  release-authority-proof:
    needs: release-please
    name: release-authority-proof pr=${{ needs.release-please.outputs.pr_number }} head=${{ needs.release-please.outputs.head_sha }}
    if: ${{ needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.head_sha != '' && needs.release-please.outputs.parent_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Assert protected release proof coordinates
        env:
          PR_NUMBER: ${{ needs.release-please.outputs.pr_number }}
          HEAD_SHA: ${{ needs.release-please.outputs.head_sha }}
          PARENT_SHA: ${{ needs.release-please.outputs.parent_sha }}
        run: |
          set -eu
          test "$PARENT_SHA" = "$GITHUB_SHA"
          test "$HEAD_SHA" != "$PARENT_SHA"
          test "${#HEAD_SHA}" -eq 40
          test "$PR_NUMBER" -gt 0
          case "$HEAD_SHA" in
            *[!0-9a-f]*) exit 1 ;;
          esac
