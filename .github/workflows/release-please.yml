name: Release Please

# Enforced semantic versioning. Conventional-commit history on main drives an
# automatically maintained release PR; merging it bumps the version, updates the
# changelog, and pushes a vX.Y.Z tag. That tag then triggers image-release.yml
# (the mnt-app server image).
#
# NOTE: release PR creation with the default GITHUB_TOKEN also requires the repo
# Actions setting "Allow GitHub Actions to create and approve pull requests".
# A tag pushed with the default GITHUB_TOKEN will NOT trigger tag-based workflows
# (GitHub suppresses recursive triggers). Add RELEASE_PLEASE_TOKEN (fine-grained
# PAT with contents:write + pull-requests:write) to chain downstream releases
# automatically; without it the release PR + tag still work, but the image
# build is triggered manually. See docs/release/SECRETS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Baseline at the last pre-conventional commit so release-please only
          # parses history AFTER it. Without this it walks back to the repo root
          # and the conventional-commit parser aborts on a non-conventional merge
          # subject ("Merge pull request #5 …"). The repo is now squash-merge-only
          # (PR title = commit), so everything after this baseline is conventional.
          bootstrap-sha: 84d39e710204e151465e8c95e7547ba39acfe31d

      # CHANGELOG.md is first-party manifest evidence. Release Please cannot update
      # docs/documentation-manifest.seed.json + docs/documentation-index.json, so the
      # release tip would fail check:doc-manifest / check:doc-links. Converge those
      # custody blobs onto the same bot tip (fail-closed path allow-list).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"
      - name: Converge documentation custody on release-please tip
        env:
          # Prefer RELEASE_PLEASE_TOKEN so a tip rewrite schedules pull_request checks.
          # Default GITHUB_TOKEN force-pushes are refused by the converge script when
          # a rewrite is required (GitHub suppresses recursive workflow triggers).
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CONSOLE_RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/console/converge-release-please-doc-custody.mjs
