name: Image Release

# Builds, scans, signs and publishes the server (console-app) container image to
# GHCR as a MULTI-ARCH manifest list
# (linux/amd64 + linux/arm64) so the images run on bare-metal amd64 as well as
# the Oracle Ampere A1 (arm64) cluster. Native-runner build: each arch builds on
# its own native runner (no QEMU — a Rust build under emulation is punishingly
# slow), pushes a single-arch image BY DIGEST, and a merge job stitches the two
# per-arch digests into one manifest list with `docker buildx imagetools
# create`. The manifest-LIST digest (the multi-arch index) is the immutable
# artifact that gets Trivy-scanned, cosign-signed, and provenance-attested.
# Completed CI is only a wake-up: ordinary main commits stop after one read-only
# classification job. Native builders run only for a canonical version-changing
# bot commit bound to an immutable published GitHub release, its exact lightweight
# tag, current main, and exact successful CI + Security workflow/job records.
# Updating the prod overlay is a separate, explicit workflow_dispatch action
# guarded by the protected production environment; a push or merge never
# mutates production desired state.
#
# The Trivy scan is a BLOCKING gate: the manifest list is tagged, but it is only
# cosign-signed + attested after BOTH arches pass the scan, so a vulnerable image
# is never signed. Hard-fail admission verification is not enabled until ops
# installs the sigstore policy-controller CRDs/controller; an audit-mode
# ClusterImagePolicy lives under deploy/apps/console/components/admission-audit.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current-main SHA whose successful push CI authorizes recovery
        required: true
        type: string
      promote_production:
        description: Promote the signed digests to the production overlay
        required: true
        default: false
        type: boolean

# Deny by default. Each job receives only the token capabilities it exercises.
permissions: {}

concurrency:
  # One release train per immutable candidate, never a mutable branch name.
  group: image-release-${{ github.event.workflow_run.head_sha || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  # `workflow_run` is only a wake-up signal. This read-only job classifies the
  # exact CI candidate and emits `eligible=false` for ordinary/stale main
  # commits. A release-version change is privileged: it must bind to an
  # immutable GitHub release + lightweight tag and exact successful CI/Security
  # workflow runs before any packages:write or OIDC job can start. No candidate
  # bytes are checked out or executed here.
  ci-admission:
    name: Classify exact immutable source release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.admit.outputs.eligible }}
      release_sha: ${{ steps.admit.outputs.release_sha }}
      release_tag: ${{ steps.admit.outputs.release_tag }}
      release_version: ${{ steps.admit.outputs.release_version }}
      ci_run_id: ${{ steps.admit.outputs.ci_run_id }}
      security_run_id: ${{ steps.admit.outputs.security_run_id }}
    steps:
      - name: Bind immutable release, tag, CI, Security, and current main
        id: admit
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: "1269693002"
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ADMISSION_MAX_POLLS: "12"
          ADMISSION_POLL_SECONDS: "10"
        run: |
          set -euo pipefail

          readonly CI_WORKFLOW_ID="296023727"
          readonly CI_WORKFLOW_PATH=".github/workflows/ci.yml"
          readonly RELEASE_WORKFLOW_ID="296023729"
          readonly RELEASE_WORKFLOW_PATH=".github/workflows/release-please.yml"
          readonly RELEASE_WORKFLOW_NAME="Release Please"
          readonly SECURITY_WORKFLOW_ID="296023731"
          readonly SECURITY_WORKFLOW_PATH=".github/workflows/security.yml"
          readonly RELEASE_BOT_ID="41898282"
          readonly RELEASE_TRANSPORT_ID="56489493"
          readonly WEB_FLOW_ID="19864447"
          readonly STABLE_VERSION_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          readonly RELEASE_SUBJECT_RE='^chore\(main\): release ((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)) \(#([1-9][0-9]*)\)$'
          readonly RELEASE_HEAD_REF_RE='^release-please--branches--main--components--[A-Za-z0-9._-]+$'

          die() {
            echo "::error::$*" >&2
            exit 1
          }

          skip_publication() {
            local reason="$1"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Image publication skipped"
              echo ""
              echo "- reason: ${reason}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          api() {
            timeout 20s gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Cache-Control: no-cache" \
              "$@"
          }

          current_main() {
            local ref
            ref="$(api "repos/${REPO}/git/ref/heads/main")" || die "unable to read current main"
            jq -e \
              '.object.type == "commit" and (.object.sha | type == "string") and
               (.object.sha | length == 40 and test("^[0-9a-f]{40}$"))' \
              <<< "$ref" >/dev/null \
              || die "main ref is not one exact commit"
            jq -r '.object.sha' <<< "$ref"
          }

          read_manifest_version() {
            local sha="$1" version
            # Keep the untrusted raw response out of a Bash variable: command
            # substitution strips NUL bytes before jq can reject them. Only
            # capture jq's already validated ASCII SemVer result.
            version="$(
              api -H "Accept: application/vnd.github.raw+json" \
                "repos/${REPO}/contents/.release-please-manifest.json?ref=${sha}" \
                | jq -er --arg stable_re "$STABLE_VERSION_RE" \
                    'if type == "object" and keys == ["."] and
                        (.["."] | type == "string" and length > 0 and
                         (explode | all(. == 46 or (. >= 48 and . <= 57))) and
                         test($stable_re))
                     then .["."]
                     else error("release manifest must be the canonical root-only object")
                     end'
            )" || die "unable to read or validate release manifest at ${sha}"
            [[ "$version" =~ $STABLE_VERSION_RE ]] \
              || die "release manifest version is not stable SemVer"
            printf '%s' "$version"
          }

          canonical_release_pr_snapshot() {
            jq -ecS '[
              .number, .state, .draft, .merged, .merged_at, .merge_commit_sha, .title,
              [.user.id, .user.login, .user.type],
              [.base.ref, .base.sha, .base.repo.id, .base.repo.full_name],
              [.head.ref, .head.sha, .head.repo.id, .head.repo.full_name]
            ]'
          }

          canonical_release_head_snapshot() {
            jq -ecS '[
              .sha, .commit.tree.sha, [.parents[].sha], .commit.message,
              [.commit.author.name, .commit.author.email],
              [.commit.committer.name, .commit.committer.email],
              [.author.id, .author.login, .author.type],
              [.committer.id, .committer.login, .committer.type],
              ([.files[] | {filename, status}] | sort_by(.filename))
            ]'
          }

          canonical_release_run_set_snapshot() {
            jq -ecS '[
              .total_count,
              ([.workflow_runs[] | [
                .id, .workflow_id, .path, .event, .head_branch, .head_sha,
                .run_number, .run_attempt, .status, .conclusion,
                .repository.id, .repository.full_name
              ]] | sort_by(.[0]))
            ]'
          }

          # Sets EVIDENCE_RUN_ID and EVIDENCE_RUN_ATTEMPT. Return 10 only for
          # genuinely pending/absent evidence; terminal disagreement exits.
          verify_workflow_evidence() {
            local workflow_id="$1" workflow_path="$2" aggregate_name="$3"
            local expected_trigger_id="${4:-}" runs total run jobs matches fresh_runs fresh_run
            runs="$(api "repos/${REPO}/actions/workflows/${workflow_id}/runs?event=push&branch=main&head_sha=${candidate_sha}&per_page=100")" \
              || die "unable to read ${aggregate_name} workflow runs"
            jq -e '(.total_count | type == "number" and . >= 0 and floor == .) and
              (.workflow_runs | type == "array")' <<< "$runs" >/dev/null \
              || die "${aggregate_name} run evidence is malformed"
            total="$(jq -r '.total_count' <<< "$runs")"
            if [[ "$total" == "0" ]]; then
              return 10
            fi
            [[ "$total" == "1" && "$(jq '.workflow_runs | length' <<< "$runs")" == "1" ]] \
              || die "${aggregate_name} must have exactly one exact-SHA main-push run"
            run="$(jq -c '.workflow_runs[0]' <<< "$runs")"
            jq -e \
              --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
              --argjson workflow_id "$workflow_id" \
              --arg path "$workflow_path" \
              --arg sha "$candidate_sha" \
              '.repository.id == $repository_id and .workflow_id == $workflow_id and
               .path == $path and .event == "push" and .head_branch == "main" and
               .head_sha == $sha and
               (.id | type == "number" and . >= 1 and floor == .) and
               (.run_attempt | type == "number" and . >= 1 and floor == .)' \
              <<< "$run" >/dev/null || die "${aggregate_name} run identity disagrees with the protected workflow"
            EVIDENCE_RUN_ID="$(jq -r '.id' <<< "$run")"
            EVIDENCE_RUN_ATTEMPT="$(jq -r '.run_attempt' <<< "$run")"
            if [[ -n "$expected_trigger_id" && "$EVIDENCE_RUN_ID" != "$expected_trigger_id" ]]; then
              die "triggering CI run is not the unique exact-SHA CI run"
            fi
            if ! jq -e '.status == "completed"' <<< "$run" >/dev/null; then
              jq -e '(.status | type == "string") and .conclusion == null' \
                <<< "$run" >/dev/null \
                || die "${aggregate_name} workflow status is malformed"
              return 10
            fi
            jq -e '.conclusion == "success"' <<< "$run" >/dev/null \
              || die "${aggregate_name} workflow is terminally non-success"

            jobs="$(api "repos/${REPO}/actions/runs/${EVIDENCE_RUN_ID}/attempts/${EVIDENCE_RUN_ATTEMPT}/jobs?per_page=100")" \
              || die "unable to read ${aggregate_name} jobs"
            jq -e '(.total_count | type == "number" and . >= 0 and . <= 100 and floor == .) and
              (.jobs | type == "array") and (.jobs | length) == .total_count' \
              <<< "$jobs" >/dev/null \
              || die "${aggregate_name} job evidence is malformed or truncated"
            matches="$(jq -c --arg name "$aggregate_name" '[.jobs[] | select(.name == $name)]' <<< "$jobs")"
            jq -e 'length == 1' <<< "$matches" >/dev/null \
              || die "${aggregate_name} must identify exactly one aggregate job"
            if ! jq -e '.[0].status == "completed"' <<< "$matches" >/dev/null; then
              jq -e '(.[0].status | type == "string") and .[0].conclusion == null' \
                <<< "$matches" >/dev/null \
                || die "${aggregate_name} aggregate status is malformed"
              return 10
            fi
            jq -e '.[0].conclusion == "success"' <<< "$matches" >/dev/null \
              || die "${aggregate_name} aggregate is terminally non-success"

            # A rerun can advance the current attempt between the run-list read
            # and the attempt-scoped jobs read. Re-list after the aggregate and
            # require the same attempt to remain the unique completed success.
            fresh_runs="$(api "repos/${REPO}/actions/workflows/${workflow_id}/runs?event=push&branch=main&head_sha=${candidate_sha}&per_page=100")" \
              || die "unable to re-read ${aggregate_name} workflow run"
            jq -e '.total_count == 1 and
              (.workflow_runs | type == "array" and length == 1)' \
              <<< "$fresh_runs" >/dev/null \
              || die "${aggregate_name} run set changed while aggregate evidence was read"
            fresh_run="$(jq -c '.workflow_runs[0]' <<< "$fresh_runs")"
            jq -e \
              --argjson run_id "$EVIDENCE_RUN_ID" \
              --argjson run_attempt "$EVIDENCE_RUN_ATTEMPT" \
              '.id == $run_id and .run_attempt == $run_attempt and
               .status == "completed" and .conclusion == "success"' \
              <<< "$fresh_run" >/dev/null \
              || die "${aggregate_name} current attempt changed while aggregate evidence was read"
            return 0
          }

          # Sets RELEASE_ID after proving both release endpoints and the
          # lightweight tag describe the exact immutable candidate.
          verify_release_snapshot() {
            local by_tag by_id tag_ref
            if ! by_tag="$(api "repos/${REPO}/releases/tags/${release_tag}" 2>&1)"; then
              if [[ "$by_tag" == *"(HTTP 404)"* ]]; then
                return 10
              fi
              die "unable to read source release by tag"
            fi
            jq -e \
              --arg tag "$release_tag" \
              --arg sha "$candidate_sha" \
              --argjson bot_id "$RELEASE_BOT_ID" \
              '.tag_name == $tag and .target_commitish == $sha and
               .draft == false and .prerelease == false and .immutable == true and
               (.published_at | type == "string" and length > 0) and
               (.id | type == "number" and . >= 1 and floor == .) and
               .author.id == $bot_id and
               .author.login == "github-actions[bot]" and .author.type == "Bot"' \
              <<< "$by_tag" >/dev/null \
              || die "source release is mutable, unpublished, or disagrees with the exact candidate"
            RELEASE_ID="$(jq -r '.id' <<< "$by_tag")"
            by_id="$(api "repos/${REPO}/releases/${RELEASE_ID}")" \
              || die "unable to reread source release by immutable ID"
            [[ "$(jq -cS . <<< "$by_id")" == "$(jq -cS . <<< "$by_tag")" ]] \
              || die "release-by-ID and release-by-tag disagree"
            tag_ref="$(api "repos/${REPO}/git/ref/tags/${release_tag}")" \
              || die "unable to read source release tag"
            jq -e --arg sha "$candidate_sha" \
              '.object.type == "commit" and .object.sha == $sha' \
              <<< "$tag_ref" >/dev/null \
              || die "source release tag is annotated or moved away from the candidate"
          }

          [[ "$REPO" == "oyatie/console" && "$EXPECTED_REPOSITORY_ID" == "1269693002" ]] \
            || die "image publication is bound to the canonical repository"
          [[ "$RUN_ATTEMPT" == "1" ]] || die "Image Release reruns are not release authority"

          case "$EVENT_NAME" in
            workflow_run)
              [[ "$TRIGGER_RUN_ID" =~ ^[1-9][0-9]*$ && "$TRIGGER_WORKFLOW_NAME" == "CI" ]] \
                || die "unexpected completed workflow"
              [[ "$TRIGGER_WORKFLOW_EVENT" == "push" && "$TRIGGER_WORKFLOW_HEAD_BRANCH" == "main" ]] \
                || die "only main push CI may wake image publication"
              candidate_sha="$TRIGGER_WORKFLOW_HEAD_SHA"
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || die "trigger lacks an exact candidate SHA"
              trigger_run="$(api "repos/${REPO}/actions/runs/${TRIGGER_RUN_ID}")" \
                || die "unable to live-read triggering CI run"
              jq -e \
                --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
                --argjson workflow_id "$CI_WORKFLOW_ID" \
                --argjson run_id "$TRIGGER_RUN_ID" \
                --arg path "$CI_WORKFLOW_PATH" \
                --arg sha "$candidate_sha" \
                --arg conclusion "$TRIGGER_WORKFLOW_CONCLUSION" \
                '.repository.id == $repository_id and .workflow_id == $workflow_id and
                 .id == $run_id and .path == $path and .event == "push" and
                 .head_branch == "main" and .head_sha == $sha and .status == "completed" and
                 .conclusion == $conclusion and
                 (.run_attempt | type == "number" and . >= 1 and floor == .)' \
                <<< "$trigger_run" >/dev/null || die "triggering CI metadata changed or is untrusted"
              [[ "$TRIGGER_WORKFLOW_CONCLUSION" == "success" ]] \
                || skip_publication "source CI did not succeed"
              [[ "$(jq -r '.run_attempt' <<< "$trigger_run")" == "1" ]] \
                || skip_publication "source CI rerun is not automatic publication authority"
              trigger_run_attempt="1"
              ;;
            workflow_dispatch)
              [[ "$DISPATCH_REF" == "refs/heads/main" ]] \
                || die "manual recovery requires a first-attempt main dispatch"
              candidate_sha="$DISPATCH_CANDIDATE_SHA"
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] \
                || die "candidate_sha must be a full lowercase SHA"
              ;;
            *) die "unsupported release trigger" ;;
          esac

          current_main_sha="$(current_main)"
          if [[ "$current_main_sha" != "$candidate_sha" ]]; then
            [[ "$EVENT_NAME" == "workflow_run" ]] \
              && skip_publication "candidate is no longer current main"
            die "manual recovery candidate is not current main"
          fi

          commit="$(api "repos/${REPO}/commits/${candidate_sha}")" \
            || die "unable to read candidate commit"
          jq -e --arg sha "$candidate_sha" \
            '.sha == $sha and (.parents | length) == 1 and
             (.parents[0].sha | type == "string" and length == 40 and
              test("^[0-9a-f]{40}$"))' \
            <<< "$commit" >/dev/null || die "candidate must have one exact parent"
          parent_sha="$(jq -r '.parents[0].sha' <<< "$commit")"
          candidate_version="$(read_manifest_version "$candidate_sha")"
          parent_version="$(read_manifest_version "$parent_sha")"
          if [[ "$candidate_version" == "$parent_version" ]]; then
            skip_publication "release manifest version is unchanged"
          fi

          jq -e --arg subject_re "$RELEASE_SUBJECT_RE" \
            '(.commit.message | type == "string") and
             (.commit.message | split("\n")[0] | test($subject_re))' \
            <<< "$commit" >/dev/null \
            || die "version-changing candidate lacks the exact release subject"
          subject="$(jq -r '.commit.message | split("\n")[0]' <<< "$commit")"
          [[ "$subject" =~ $RELEASE_SUBJECT_RE ]] \
            || die "version-changing candidate lacks the exact release subject"
          subject_version="${BASH_REMATCH[1]}"
          release_pr_number="${BASH_REMATCH[5]}"
          [[ "$subject_version" == "$candidate_version" ]] \
            || die "release subject and manifest version disagree"
          [[ "$release_pr_number" =~ ^[1-9][0-9]{0,14}$ ]] \
            || die "release subject PR number is outside the exact integer bound"
          expected_release_title="chore(main): release ${candidate_version}"

          release_pr="$(api "repos/${REPO}/pulls/${release_pr_number}")" \
            || die "unable to read the release pull request"
          jq -e \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson pr_number "$release_pr_number" \
            --argjson bot_id "$RELEASE_BOT_ID" \
            --argjson transport_id "$RELEASE_TRANSPORT_ID" \
            --arg candidate "$candidate_sha" \
            --arg parent "$parent_sha" \
            --arg title "$expected_release_title" \
            --arg head_ref_re "$RELEASE_HEAD_REF_RE" \
            --arg repo "$REPO" \
            '.number == $pr_number and .state == "closed" and .draft == false and
             .merged == true and (.merged_at | type == "string" and length > 0) and
             .merge_commit_sha == $candidate and .title == $title and
             .base.ref == "main" and .base.sha == $parent and
             .base.repo.id == $repository_id and .base.repo.full_name == $repo and
             (.head.ref | type == "string" and test($head_ref_re)) and
             (.head.sha | type == "string" and length == 40 and test("^[0-9a-f]{40}$")) and
             .head.repo.id == $repository_id and .head.repo.full_name == $repo and
             ((.user.id == $bot_id and .user.login == "github-actions[bot]" and .user.type == "Bot") or
              (.user.id == $transport_id and .user.login == "jason931225" and .user.type == "User"))' \
            <<< "$release_pr" >/dev/null \
            || die "release pull request provenance is invalid"
          if jq -e --argjson bot_id "$RELEASE_BOT_ID" \
            '.user.id == $bot_id and .user.login == "github-actions[bot]" and .user.type == "Bot"' \
            <<< "$release_pr" >/dev/null; then
            release_creator_class="bot"
          elif jq -e --argjson transport_id "$RELEASE_TRANSPORT_ID" \
            '.user.id == $transport_id and .user.login == "jason931225" and .user.type == "User"' \
            <<< "$release_pr" >/dev/null; then
            release_creator_class="transport"
          else
            die "release pull request creator is outside the protected classes"
          fi
          release_head_sha="$(jq -r '.head.sha' <<< "$release_pr")"
          release_pr_snapshot="$(canonical_release_pr_snapshot <<< "$release_pr")" \
            || die "unable to snapshot release pull request provenance"

          jq -e \
            --arg creator_class "$release_creator_class" \
            --argjson bot_id "$RELEASE_BOT_ID" \
            --argjson transport_id "$RELEASE_TRANSPORT_ID" \
            --argjson web_flow_id "$WEB_FLOW_ID" \
            '((($creator_class == "bot") and
               .commit.author.name == "github-actions[bot]" and
               .commit.author.email == "41898282+github-actions[bot]@users.noreply.github.com" and
               .author.id == $bot_id and .author.login == "github-actions[bot]" and .author.type == "Bot") or
              (($creator_class == "transport") and
               .commit.author.name == "Jason Lee" and
               .commit.author.email == "56489493+jason931225@users.noreply.github.com" and
               .author.id == $transport_id and .author.login == "jason931225" and .author.type == "User")) and
             (.commit.tree.sha | type == "string" and length == 40 and test("^[0-9a-f]{40}$")) and
             .commit.committer.name == "GitHub" and .commit.committer.email == "noreply@github.com" and
             .commit.verification.verified == true and .commit.verification.reason == "valid" and
             .committer.id == $web_flow_id and .committer.login == "web-flow" and .committer.type == "User" and
             ([.files[] | {filename, status}] | sort_by(.filename)) ==
               ([
                 {filename: ".release-please-manifest.json", status: "modified"},
                 {filename: "CHANGELOG.md", status: "modified"},
                 {filename: "docs/documentation-index.json", status: "modified"},
                 {filename: "docs/documentation-manifest.seed.json", status: "modified"}
               ] | sort_by(.filename))' \
            <<< "$commit" >/dev/null || die "release commit identity or exact four-file envelope is invalid"
          candidate_tree="$(jq -r '.commit.tree.sha' <<< "$commit")"

          release_head="$(api "repos/${REPO}/commits/${release_head_sha}")" \
            || die "unable to read the protected release head"
          jq -e \
            --arg head "$release_head_sha" \
            --arg parent "$parent_sha" \
            --arg tree "$candidate_tree" \
            --arg subject "$expected_release_title" \
            --argjson bot_id "$RELEASE_BOT_ID" \
            --argjson web_flow_id "$WEB_FLOW_ID" \
            '.sha == $head and (.parents | length) == 1 and .parents[0].sha == $parent and
             .commit.tree.sha == $tree and
             (.commit.message | type == "string") and
             (.commit.message | split("\n")[0]) == $subject and
             .commit.author.name == "github-actions[bot]" and
             .commit.author.email == "41898282+github-actions[bot]@users.noreply.github.com" and
             .commit.committer.name == "GitHub" and .commit.committer.email == "noreply@github.com" and
             .author.id == $bot_id and .author.login == "github-actions[bot]" and .author.type == "Bot" and
             .committer.id == $web_flow_id and .committer.login == "web-flow" and .committer.type == "User" and
             ([.files[] | {filename, status}] | sort_by(.filename)) ==
               ([
                 {filename: ".release-please-manifest.json", status: "modified"},
                 {filename: "CHANGELOG.md", status: "modified"},
                 {filename: "docs/documentation-index.json", status: "modified"},
                 {filename: "docs/documentation-manifest.seed.json", status: "modified"}
               ] | sort_by(.filename))' \
            <<< "$release_head" >/dev/null \
            || die "protected release head does not bind the exact squash tree"
          release_head_snapshot="$(canonical_release_head_snapshot <<< "$release_head")" \
            || die "unable to snapshot protected release head"

          release_runs_endpoint="repos/${REPO}/actions/workflows/${RELEASE_WORKFLOW_ID}/runs?event=push&branch=main&head_sha=${parent_sha}&per_page=100"
          release_runs="$(api "$release_runs_endpoint")" \
            || die "unable to read protected Release Please proof runs"
          jq -e \
            --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
            --argjson workflow_id "$RELEASE_WORKFLOW_ID" \
            --arg path "$RELEASE_WORKFLOW_PATH" \
            --arg parent "$parent_sha" \
            --arg repo "$REPO" \
            '.total_count == 1 and (.workflow_runs | type == "array" and length == 1) and
             .workflow_runs[0].workflow_id == $workflow_id and
             .workflow_runs[0].path == $path and .workflow_runs[0].event == "push" and
             .workflow_runs[0].head_branch == "main" and .workflow_runs[0].head_sha == $parent and
             .workflow_runs[0].repository.id == $repository_id and
             .workflow_runs[0].repository.full_name == $repo and
             (.workflow_runs[0].id | type == "number" and . >= 1 and floor == .) and
             (.workflow_runs[0].run_number | type == "number" and . >= 1 and floor == .) and
             (.workflow_runs[0].run_attempt | type == "number" and . >= 1 and floor == .) and
             .workflow_runs[0].status == "completed" and .workflow_runs[0].conclusion == "success"' \
            <<< "$release_runs" >/dev/null \
            || die "protected Release Please proof run is missing or invalid"
          release_run_id="$(jq -r '.workflow_runs[0].id' <<< "$release_runs")"
          release_run_attempt="$(jq -r '.workflow_runs[0].run_attempt' <<< "$release_runs")"
          release_run_snapshot="$(canonical_release_run_set_snapshot <<< "$release_runs")" \
            || die "unable to snapshot protected Release Please proof run"

          release_jobs="$(api "repos/${REPO}/actions/runs/${release_run_id}/attempts/${release_run_attempt}/jobs?per_page=100")" \
            || die "unable to read protected Release Please proof jobs"
          jq -e '(.total_count | type == "number" and . >= 0 and . <= 100 and floor == .) and
            (.jobs | type == "array") and (.jobs | length) == .total_count' \
            <<< "$release_jobs" >/dev/null \
            || die "protected Release Please proof jobs are malformed or truncated"
          release_proof_job_name="release-authority-proof pr=${release_pr_number} head=${release_head_sha}"
          release_proof_matches="$(jq -c --arg name "$release_proof_job_name" \
            '[.jobs[] | select(.name == $name)]' <<< "$release_jobs")"
          jq -e \
            --argjson run_id "$release_run_id" \
            --argjson run_attempt "$release_run_attempt" \
            --arg workflow_name "$RELEASE_WORKFLOW_NAME" \
            --arg parent "$parent_sha" \
            'length == 1 and
             (.[0].id | type == "number" and . >= 1 and floor == .) and
             .[0].run_id == $run_id and .[0].run_attempt == $run_attempt and
             .[0].workflow_name == $workflow_name and .[0].head_sha == $parent and
             .[0].status == "completed" and .[0].conclusion == "success"' \
            <<< "$release_proof_matches" >/dev/null \
            || die "native Release Please authority proof does not bind the exact PR and head"

          release_tag="v${candidate_version}"
          max_polls="${ADMISSION_MAX_POLLS:-12}"
          poll_seconds="${ADMISSION_POLL_SECONDS:-10}"
          [[ "$max_polls" =~ ^[1-9][0-9]*$ && "$poll_seconds" =~ ^[0-9]+$ ]] \
            || die "admission polling bounds are invalid"

          ready=false
          for ((poll = 1; poll <= max_polls; poll++)); do
            polled_main_sha="$(current_main)"
            if [[ "$polled_main_sha" != "$candidate_sha" ]]; then
              [[ "$EVENT_NAME" == "workflow_run" ]] \
                && skip_publication "main advanced while release evidence was pending"
              die "main advanced while release evidence was pending"
            fi
            pending=false
            if verify_release_snapshot; then
              :
            else
              evidence_status="$?"
              [[ "$evidence_status" == "10" ]] || exit "$evidence_status"
              pending=true
            fi
            if verify_workflow_evidence "$CI_WORKFLOW_ID" "$CI_WORKFLOW_PATH" "Required / CI" \
              "$([[ "$EVENT_NAME" == "workflow_run" ]] && printf '%s' "$TRIGGER_RUN_ID")"; then
              ci_run_id="$EVIDENCE_RUN_ID"
              ci_run_attempt="$EVIDENCE_RUN_ATTEMPT"
              if [[ "$EVENT_NAME" == "workflow_run" && "$ci_run_attempt" != "$trigger_run_attempt" ]]; then
                skip_publication "source CI attempt advanced after the wake-up"
              fi
            else
              evidence_status="$?"
              [[ "$evidence_status" == "10" ]] || exit "$evidence_status"
              pending=true
            fi
            if verify_workflow_evidence "$SECURITY_WORKFLOW_ID" "$SECURITY_WORKFLOW_PATH" "Required / Security"; then
              security_run_id="$EVIDENCE_RUN_ID"
              security_run_attempt="$EVIDENCE_RUN_ATTEMPT"
            else
              evidence_status="$?"
              [[ "$evidence_status" == "10" ]] || exit "$evidence_status"
              pending=true
            fi
            if [[ "$pending" == "false" ]]; then
              ready=true
              break
            fi
            [[ "$poll" -lt "$max_polls" ]] || die "release, CI, or Security evidence did not converge within the bounded wait"
            sleep "$poll_seconds"
          done
          [[ "$ready" == "true" ]] || die "release admission ended without complete evidence"

          release_id="$RELEASE_ID"
          verify_release_snapshot || die "source release disappeared during final readback"
          [[ "$RELEASE_ID" == "$release_id" ]] || die "source release ID changed during admission"
          verify_workflow_evidence "$CI_WORKFLOW_ID" "$CI_WORKFLOW_PATH" "Required / CI" \
            "$([[ "$EVENT_NAME" == "workflow_run" ]] && printf '%s' "$TRIGGER_RUN_ID")" \
            || die "CI changed during final readback"
          [[ "$EVIDENCE_RUN_ID" == "$ci_run_id" && "$EVIDENCE_RUN_ATTEMPT" == "$ci_run_attempt" ]] \
            || die "CI run identity changed during admission"
          verify_workflow_evidence "$SECURITY_WORKFLOW_ID" "$SECURITY_WORKFLOW_PATH" "Required / Security" \
            || die "Security changed during final readback"
          [[ "$EVIDENCE_RUN_ID" == "$security_run_id" && "$EVIDENCE_RUN_ATTEMPT" == "$security_run_attempt" ]] \
            || die "Security run identity changed during admission"
          fresh_release_pr="$(api "repos/${REPO}/pulls/${release_pr_number}")" \
            || die "release pull request disappeared during final readback"
          fresh_release_pr_snapshot="$(canonical_release_pr_snapshot <<< "$fresh_release_pr")" \
            || die "release pull request became malformed during final readback"
          [[ "$fresh_release_pr_snapshot" == "$release_pr_snapshot" ]] \
            || die "release pull request changed during admission"
          fresh_release_head="$(api "repos/${REPO}/commits/${release_head_sha}")" \
            || die "protected release head disappeared during final readback"
          fresh_release_head_snapshot="$(canonical_release_head_snapshot <<< "$fresh_release_head")" \
            || die "protected release head became malformed during final readback"
          [[ "$fresh_release_head_snapshot" == "$release_head_snapshot" ]] \
            || die "protected release head changed during admission"
          fresh_release_runs="$(api "$release_runs_endpoint")" \
            || die "protected Release Please proof run disappeared during final readback"
          fresh_release_run_snapshot="$(canonical_release_run_set_snapshot <<< "$fresh_release_runs")" \
            || die "protected Release Please proof run became malformed during final readback"
          [[ "$fresh_release_run_snapshot" == "$release_run_snapshot" ]] \
            || die "protected Release Please proof run changed during admission"
          [[ "$(current_main)" == "$candidate_sha" ]] \
            || die "candidate stopped being current main before publication authorization"

          {
            echo "eligible=true"
            echo "release_sha=$candidate_sha"
            echo "release_tag=$release_tag"
            echo "release_version=$candidate_version"
            echo "ci_run_id=$ci_run_id"
            echo "security_run_id=$security_run_id"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Exact immutable source release admitted"
            echo ""
            echo "- release: ${release_tag} (ID ${release_id})"
            echo "- source SHA: ${candidate_sha}"
            echo "- release PR/head: #${release_pr_number} / ${release_head_sha}"
            echo "- Release Please proof run: ${release_run_id} attempt ${release_run_attempt}"
            echo "- CI run: ${ci_run_id} attempt ${ci_run_attempt}"
            echo "- Security run: ${security_run_id} attempt ${security_run_attempt}"
          } >> "$GITHUB_STEP_SUMMARY"

  # One native build per (image, arch). Each leg builds its arch on the matching
  # native runner (amd64 → ubuntu-24.04, arm64 → ubuntu-24.04-arm) and pushes the
  # single-arch image BY DIGEST only (no tags yet — the merge job tags the
  # manifest list). provenance+sbom attestations are attached per arch and are
  # preserved through the manifest-list merge. Each leg exports its digest as an
  # artifact for the merge job to fan in.
  build:
    name: ${{ matrix.image.name }} (${{ matrix.platform.arch }}) — build / push by digest
    needs: ci-admission
    if: needs.ci-admission.outputs.eligible == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: console-app, dockerfile: backend/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-24.04, target: linux/amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: linux/arm64 }
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.ci-admission.outputs.release_sha }}
          persist-credentials: false

      # Deterministic build timestamps — rewrite layer/image mtimes to the
      # commit time so the same source produces a bit-reproducible image.
      - name: Set SOURCE_DATE_EPOCH from commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here — the by-digest push carries no tags; tags are applied
      # to the manifest list in the merge job.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.ci-admission.outputs.release_version }}
            org.opencontainers.image.revision=${{ needs.ci-admission.outputs.release_sha }}

      - name: Build and push by digest (${{ matrix.platform.target }})
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: . # repo root: backend embeds docs/ at compile time
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.target }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: publish the single-arch image under its content
          # digest with no tag; the merge job assembles the tagged manifest list.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max # SLSA provenance attestation, per arch
          sbom: true # in-toto SPDX SBOM attestation, per arch
          # Build cache lives in GHCR, NOT the shared Actions 10GB pool.
          # GHA type=gha mode=max previously filled the budget with buildkit-blob
          # keys (~10GB) and LRU-evicted rust-cache. Registry cache is per
          # image×arch ref so amd64/arm64 do not clobber each other; mode=max is
          # fine here because it does not compete with backend-cargo/npm.
          # Hygiene: .github/workflows/cache-hygiene.yml prunes any residual
          # buildkit/index GHA keys on a schedule.
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.platform.arch }},mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      # Fan-in to the merge job: one tiny artifact per (image, arch) carrying the
      # single-arch digest that imagetools will stitch into the manifest list.
      - name: Stash per-arch digest
        run: printf '%s' "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}.txt"
      - name: Upload per-arch digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}.txt
          retention-days: 1
          if-no-files-found: error

  # Merge the two per-arch by-digest images into one multi-arch manifest list,
  # then run the full gate against the LIST digest: Trivy (both arches),
  # cosign-sign, provenance-attest, and stash the list digest for the bump job.
  # Everything downstream (release-probe, bump-digests) consumes this list digest.
  merge:
    name: ${{ matrix.image.name }} — merge manifest / scan / sign / push
    needs: [ci-admission, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: console-app }
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.ci-admission.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.ci-admission.outputs.release_tag }}
            type=raw,value=main
            type=raw,value=edge
            type=raw,value=sha-${{ needs.ci-admission.outputs.release_sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.ci-admission.outputs.release_version }}
            org.opencontainers.image.revision=${{ needs.ci-admission.outputs.release_sha }}

      - name: Download amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.image.name }}-amd64
          path: digests
      - name: Download arm64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.image.name }}-arm64
          path: digests

      # Stitch the two single-arch digests into one manifest list under every
      # derived tag, then read the LIST (index) digest back — that is the
      # immutable multi-arch artifact everything downstream must reference.
      - name: Create multi-arch manifest list + capture its digest
        id: manifest
        run: |
          AMD_DIGEST="$(cat "digests/digest-${IMAGE}-amd64.txt")"
          ARM_DIGEST="$(cat "digests/digest-${IMAGE}-arm64.txt")"
          # Build `-t <tag>` args as an array (no unquoted word-splitting).
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE_NAME}@${AMD_DIGEST}" "${IMAGE_NAME}@${ARM_DIGEST}"
          FIRST_TAG="$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          LIST_DIGEST="$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{.Manifest.Digest}}')"
          case "$LIST_DIGEST" in
            sha256:*) ;;
            *) echo "::error::failed to resolve manifest-list digest (got '$LIST_DIGEST')"; exit 1 ;;
          esac
          echo "digest=$LIST_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Manifest-list digest for ${IMAGE_NAME}: $LIST_DIGEST"
        env:
          IMAGE: ${{ matrix.image.name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      # BLOCKING vulnerability gate. Runs against the pushed manifest-list digest,
      # once per arch, BEFORE the signing step — so nothing vulnerable is signed.
      # --image-src remote scans the REMOTE registry image (buildx push never
      # loads it into the local daemon); --platform selects each arch's
      # manifest out of the multi-arch index.
      # This packages:write/OIDC job deliberately does not checkout or execute
      # candidate-local actions. Install the same checksum-pinned scanner used
      # by Security before scanning the already-pushed immutable digest.
      - name: Install checksum-pinned Trivy without candidate checkout
        run: |
          archive="${RUNNER_TEMP}/trivy_0.71.1_Linux-64bit.tar.gz"
          install_dir="${RUNNER_TEMP}/trivy-install"
          curl --disable --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v0.71.1/trivy_0.71.1_Linux-64bit.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '3cbae37cd440cd8676e5ce9207fe460b5641c7579a17e9d00f8894928c41a88d' "$archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" trivy
          sudo install -m 0755 "$install_dir/trivy" /usr/local/bin/trivy
          /usr/local/bin/trivy --version
      - name: Trivy scan both arches (fail on HIGH/CRITICAL)
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "::group::Trivy ${platform}"
            trivy image --image-src remote --platform "$platform" \
              --exit-code 1 --ignore-unfixed \
              --vuln-type os,library --severity HIGH,CRITICAL \
              "${IMAGE_NAME}@${DIGEST}"
            echo "::endgroup::"
          done
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      # Keyless signature over the immutable manifest-list digest (OIDC → Fulcio
      # → Rekor). Signing the index covers both per-arch manifests.
      - name: Sign the manifest list (keyless)
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.manifest.outputs.digest }}

      - name: Attest build provenance (manifest list)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image.name }} (linux/amd64 + linux/arm64)"
            echo ""
            echo "- manifest-list digest: \`${{ steps.manifest.outputs.digest }}\`"
            echo "- tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- both arches scanned (HIGH/CRITICAL gate), SBOM + provenance attested, cosign-signed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Carry the manifest-list digest to the bump-digests job. A matrix collapses
      # to one shared job-outputs map (legs overwrite each other), so a tiny
      # per-image artifact is the robust fan-in for the downstream consumer.
      - name: Stash manifest-list digest for the bump job
        run: printf '%s' "${{ steps.manifest.outputs.digest }}" > "digest-${{ matrix.image.name }}.txt"
      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image.name }}
          path: digest-${{ matrix.image.name }}.txt
          retention-days: 1
          if-no-files-found: error

  # Plan W3.3(c) / pre-mortem #1: the dev-auth local role-switch endpoint must
  # be REACHABLE NOWHERE outside a dev build. `console-gate-dev-auth-absence`
  # (backend job) proves it at the cargo-metadata feature-graph level, and
  # `dev_auth_absence.rs` proves it at the HTTP level for a plain `cargo test`
  # build — this is the THIRD, primary proof: the exact signed image that
  # ships. Runs the freshly built+signed `console-app` digest for real and asserts
  # its route table has no `/api/v1/dev-auth/session` at all (404, not a 401/
  # 400 that would mean the route exists but rejected the request).
  #
  # The job also carries the release pipeline's POST-MIGRATION canonical
  # writer-ownership census (console-soe). The provision step's reconcile runs
  # before migrations by construction — the image cannot migrate until the
  # roles exist — so its census legitimately examines zero canonical tables. A
  # dedicated step after the migrate step re-runs the census armed, via
  # backend/ci/gates/writer-ownership/canonical-enforce.sh, so the release
  # gate enforces on a real schema instead of performing a structural no-op.
  release-probe:
    name: console-app image — dev-auth route absence probe
    needs: [ci-admission, merge]
    permissions:
      contents: read
      packages: read
    # The console-app manifest list now carries both linux/amd64 and linux/arm64, so
    # `docker pull @<list-digest>` resolves the runner's arch on either. Kept on
    # arm64 (the production cluster's arch) so the probe exercises the arch that
    # actually ships to the A1 nodes.
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20
        env:
          POSTGRES_DB: console_release_probe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d console_release_probe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.ci-admission.outputs.release_sha }}
          persist-credentials: false

      - name: Download console-app digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-console-app
          path: digests

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the just-built, just-signed image by digest
        run: |
          DIGEST="$(cat digests/digest-console-app.txt)"
          IMAGE="ghcr.io/${{ github.repository_owner }}/console-app@${DIGEST}"
          docker pull "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # A throwaway ES256 keypair: this probe only needs the app to BOOT and
      # answer /readyz + the one route check, never a real ceremony.
      - name: Generate a throwaway ES256 keypair
        run: |
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out /tmp/probe-priv.pem
          openssl ec -in /tmp/probe-priv.pem -pubout -out /tmp/probe-pub.pem
          {
            echo "PROBE_JWT_PRIVATE_KEY_PEM<<PROBE_PEM_EOF"
            cat /tmp/probe-priv.pem
            echo "PROBE_PEM_EOF"
            echo "PROBE_JWT_PUBLIC_KEY_PEM<<PROBE_PEM_EOF"
            cat /tmp/probe-pub.pem
            echo "PROBE_PEM_EOF"
          } >> "$GITHUB_ENV"

      - name: Provision and verify the probe database topology
        run: |
          APP_PASSWORD="$(openssl rand -hex 32)"
          RT_PASSWORD="$(openssl rand -hex 32)"
          LEAVE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          ONTOLOGY_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          PLATFORM_FORCE_COMMAND_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PLATFORM_FORCE_COMMAND_PASSWORD"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/ops/postgres-reconcile-topology.sh:/usr/local/bin/postgres-reconcile-topology:ro" \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DB=console_release_probe \
            -e POSTGRES_ADMIN_USER=postgres -e POSTGRES_ADMIN_PASSWORD=postgres \
            -e CONSOLE_APP_POSTGRES_PASSWORD="$APP_PASSWORD" \
            -e CONSOLE_RT_POSTGRES_PASSWORD="$RT_PASSWORD" \
            -e CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD="$LEAVE_COMMAND_PASSWORD" \
            -e CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD="$ONTOLOGY_COMMAND_PASSWORD" \
            -e CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD="$PLATFORM_FORCE_COMMAND_PASSWORD" \
            --entrypoint bash postgres:18.4@sha256:4aabea78cf39b90e834caf3af7d602a18565f6fe2508705c8d01aa63245c2e20 \
            /usr/local/bin/postgres-reconcile-topology
          {
            echo "PROBE_OWNER_DATABASE_URL=postgres://console_app:${APP_PASSWORD}@127.0.0.1:5432/console_release_probe"
            echo "PROBE_RUNTIME_DATABASE_URL=postgres://console_rt:${RT_PASSWORD}@127.0.0.1:5432/console_release_probe"
            echo "PROBE_LEAVE_COMMAND_DATABASE_URL=postgres://console_leave_cmd:${LEAVE_COMMAND_PASSWORD}@127.0.0.1:5432/console_release_probe"
            echo "PROBE_ONTOLOGY_COMMAND_DATABASE_URL=postgres://console_ontology_cmd:${ONTOLOGY_COMMAND_PASSWORD}@127.0.0.1:5432/console_release_probe"
            echo "PROBE_PLATFORM_FORCE_COMMAND_DATABASE_URL=postgres://console_platform_force_cmd:${PLATFORM_FORCE_COMMAND_PASSWORD}@127.0.0.1:5432/console_release_probe"
          } >> "$GITHUB_ENV"
          # The canonical writer-ownership enforce step below re-runs this
          # reconcile post-migration and MUST reuse these exact passwords: the
          # reconcile ALTERs the cluster-wide application roles, so a second
          # password set would break the boot step later in this job.
          umask 077
          {
            echo "POSTGRES_DB=console_release_probe"
            echo "POSTGRES_HOST=127.0.0.1"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_ADMIN_USER=postgres"
            echo "POSTGRES_ADMIN_PASSWORD=postgres"
            echo "CONSOLE_APP_POSTGRES_PASSWORD=${APP_PASSWORD}"
            echo "CONSOLE_RT_POSTGRES_PASSWORD=${RT_PASSWORD}"
            echo "CONSOLE_LEAVE_COMMAND_POSTGRES_PASSWORD=${LEAVE_COMMAND_PASSWORD}"
            echo "CONSOLE_ONTOLOGY_COMMAND_POSTGRES_PASSWORD=${ONTOLOGY_COMMAND_PASSWORD}"
            echo "CONSOLE_PLATFORM_FORCE_COMMAND_POSTGRES_PASSWORD=${PLATFORM_FORCE_COMMAND_PASSWORD}"
          } > "$RUNNER_TEMP/probe-topology.env"

      - name: Run migrations against the probe database as console_app
        run: |
          docker run --rm --network host \
            -e CONSOLE_APP_ROLE=migrate \
            -e DATABASE_URL="$PROBE_OWNER_DATABASE_URL" \
            "$IMAGE"

      # Post-migration half of the canonical writer-ownership census. The
      # provision step's reconcile ran BEFORE the image applied migrations, so
      # its census examined zero canonical tables — a structural no-op, not a
      # pass. Now that the migration point has passed, re-run it the way every
      # other automated path does (backend/ci/gates/writer-ownership/
      # canonical-enforce.sh): a disposable probe database inside the postgres
      # service container, migrated with this checkout's migration set — the
      # admitted release SHA, the same set the image embeds — then reconciled
      # with CONSOLE_TOPOLOGY_REQUIRE_CANONICAL_TABLES=1 so examining zero
      # canonical tables FAILS instead of passing silently. Sequenced BEFORE
      # the boot step because the reconcile terminates serving-role backends;
      # console_release_probe itself is left untouched.
      - name: Enforce canonical writer ownership on a migrated probe database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp ops/postgres-reconcile-topology.sh "${POSTGRES_CONTAINER}:/topology.sh"
          docker cp "$RUNNER_TEMP/probe-topology.env" "${POSTGRES_CONTAINER}:/topology.env"
          bash backend/ci/gates/writer-ownership/canonical-enforce.sh \
            "$GITHUB_WORKSPACE" "$POSTGRES_CONTAINER" canonical_probe_release

      - name: Boot the release image (the real published image — no dev-auth flag exists to pass)
        run: |
          docker run -d --network host --name console-app-probe \
            -e CONSOLE_APP_ROLE=api \
            -e DATABASE_URL="$PROBE_RUNTIME_DATABASE_URL" \
            -e LEAVE_COMMAND_DATABASE_URL="$PROBE_LEAVE_COMMAND_DATABASE_URL" \
            -e ONTOLOGY_COMMAND_DATABASE_URL="$PROBE_ONTOLOGY_COMMAND_DATABASE_URL" \
            -e PLATFORM_FORCE_COMMAND_DATABASE_URL="$PROBE_PLATFORM_FORCE_COMMAND_DATABASE_URL" \
            -e CONSOLE_HTTP_ADDR=127.0.0.1:8091 \
            -e CONSOLE_JWT_ISSUER=release-probe \
            -e CONSOLE_JWT_AUDIENCE=release-probe \
            -e CONSOLE_JWT_PRIVATE_KEY_PEM="$PROBE_JWT_PRIVATE_KEY_PEM" \
            -e CONSOLE_JWT_PUBLIC_KEY_PEM="$PROBE_JWT_PUBLIC_KEY_PEM" \
            -e CONSOLE_WEBAUTHN_RP_ID=localhost \
            -e CONSOLE_WEBAUTHN_RP_ORIGIN=http://localhost \
            -e CONSOLE_COOKIE_SECURE=false \
            "$IMAGE"

      - name: Wait for /readyz
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8091/readyz && exit 0
            sleep 2
          done
          echo "::error::console-app never became ready"
          docker logs console-app-probe || true
          exit 1

      - name: Assert POST /api/v1/dev-auth/session is ABSENT (404) in the shipped image
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8091/api/v1/dev-auth/session -H 'Content-Type: application/json' -d '{}')"
          echo "status=$status"
          if [ "$status" != "404" ]; then
            echo "::error::dev-auth route answered with $status (expected 404 — not reachable) in the release image"
            docker logs console-app-probe || true
            exit 1
          fi

      - name: Stop the probe container
        if: always()
        run: docker rm -f console-app-probe || true

  # Unprotected and read-only: reject an absent/stale/invalid one-shot
  # authorization before GitHub asks a production-environment reviewer to act.
  production-promotion-preflight:
    name: Verify immutable production authorization
    runs-on: ubuntu-latest
    needs: [ci-admission, merge, release-probe]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.promote_production == true
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized commit without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.ci-admission.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable main and production authorization
        env:
          EXPECTED_SHA: ${{ needs.ci-admission.outputs.release_sha }}
          EXPECTED_REF: ${{ github.ref }}
        run: >-
          python3 scripts/check-production-promotion-authority.py initial
          --expected-sha "$EXPECTED_SHA"
          --expected-ref "$EXPECTED_REF"

  # Explicit production promotion. A merge/main push may build, scan, sign, and
  # attest images, but it cannot mutate the Argo-tracked production overlay.
  # Promotion requires a manual dispatch on main, an explicit true input, the
  # protected production environment, and a fail-closed runtime check that the
  # environment actually has required reviewers configured.
  bump-digests:
    name: Promote signed digests to production overlay
    runs-on: ubuntu-latest
    needs: [ci-admission, merge, release-probe, production-promotion-preflight]
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.promote_production == true
    permissions:
      contents: write # job-level: only this job may push the bump commit
      actions: read # read the protected environment configuration fail-closed
      deployments: read

    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.ci-admission.outputs.release_sha }}
          fetch-depth: 0

      - name: Re-verify immutable main and production authority inside protected job
        env:
          EXPECTED_SHA: ${{ needs.ci-admission.outputs.release_sha }}
          EXPECTED_REF: ${{ github.ref }}
        run: >-
          python3 scripts/check-production-promotion-authority.py initial
          --expected-sha "$EXPECTED_SHA"
          --expected-ref "$EXPECTED_REF"

      - name: Verify exact independent production reviewer team
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ needs.ci-admission.outputs.release_sha }}
          DISPATCHER: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${RUN_ATTEMPT}" != "1" ]]; then
            echo "::error::production promotion rejects workflow reruns"
            exit 1
          fi
          if [[ "${DISPATCHER,,}" != "${TRIGGERING_ACTOR,,}" ]]; then
            echo "::error::production dispatcher and triggering actor must match on the first attempt"
            exit 1
          fi
          reviewer_context="$(python3 scripts/check-production-promotion-authority.py reviewer-context \
            --expected-sha "$EXPECTED_SHA")"
          reviewer_team_id="$(jq -er '.team_id | select(type == "number" and . > 0)' \
            <<<"${reviewer_context}")"
          evidence_author_login="$(jq -er '.evidence_author_login | select(type == "string" and length > 0)' \
            <<<"${reviewer_context}")"
          independent_reviewer_login="$(jq -er '.independent_reviewer_login | select(type == "string" and length > 0)' \
            <<<"${reviewer_context}")"
          if [[ "${DISPATCHER,,}" == "${evidence_author_login,,}" || \
                "${DISPATCHER,,}" == "${independent_reviewer_login,,}" ]]; then
            echo "::error::production dispatcher must be distinct from the evidence author and independent evidence reviewer"
            exit 1
          fi
          environment="$(gh api "repos/${REPO}/environments/production")"
          if ! jq -e --argjson team_id "${reviewer_team_id}" '
            [.protection_rules[]? | select(.type == "required_reviewers")] as $rules
            | ($rules | length) == 1
              and $rules[0].prevent_self_review == true
              and ($rules[0].reviewers | length) == 1
              and $rules[0].reviewers[0].type == "Team"
              and $rules[0].reviewers[0].reviewer.id == $team_id
          ' <<<"${environment}" >/dev/null; then
            echo "::error::production must require prevent_self_review=true and exactly the immutable evidence Team reviewer ID"
            exit 1
          fi

      - name: Download console-app digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-console-app
          path: digests

      - name: Bump prod overlay digests
        env:
          AUTHORIZED_SHA: ${{ needs.ci-admission.outputs.release_sha }}
        run: |
          APP_DIGEST="$(cat digests/digest-console-app.txt)"
          bash scripts/bump-prod-digests.sh "${APP_DIGEST}"
          python3 scripts/check-production-promotion-authority.py reset \
            --expected-sha "$AUTHORIZED_SHA"

      - name: Commit authorization consumption and optional digest bump once
        env:
          OVERLAY: deploy/apps/console/overlays/prod/kustomization.yaml
          AUTHORIZED_SHA: ${{ needs.ci-admission.outputs.release_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY" docs/release/PR-473-PRODUCTION-PROMOTION.authorization.json
          git commit -m "deploy(prod): promote console-app @${AUTHORIZED_SHA:0:7}"
          python3 scripts/check-production-promotion-authority.py pre-push \
            --expected-sha "$AUTHORIZED_SHA"
          git push origin "HEAD:main"
