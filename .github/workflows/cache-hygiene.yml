name: Cache hygiene

# Automated cleanup / hygiene protocol for the shared GitHub Actions cache
# budget (~10 GB/repo). Keeps the pool usable for rust-cache and npm.
#
# Docker BuildKit cache must live in GHCR (image-release registry cache refs
# `buildcache-<arch>`), not as buildkit-blob / index-* GHA keys.
#
# Triggers:
#   - schedule: daily off-peak
#   - workflow_dispatch: manual / dry-run
#
# Image Release uses GHCR registry caches and does not wake this write-capable
# workflow. Keeping cleanup on its own schedule prevents a read-only Image
# Release classification from cascading into cache deletion jobs.
#
# Fail-soft for individual deletes; fails the job if usage remains above the
# hard threshold after cleanup (problem stays visible).

on:
  schedule:
    # Daily 06:17 UTC — off-peak relative to image-release / CI load
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List victims without deleting
        required: false
        default: false
        type: boolean
      max_age_days:
        description: Delete non-KEEP caches older than this many days (0 = age off)
        required: false
        default: "14"
        type: string

permissions:
  actions: write  # list + delete caches
  contents: read

concurrency:
  group: cache-hygiene
  cancel-in-progress: true

jobs:
  policy-unit:
    name: Hygiene policy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"

      - name: Run hygiene policy unit tests
        run: node --test tools/ci/gha-cache-hygiene.test.mjs

  prune-gha-caches:
    name: Prune GHA caches (protocol)
    needs: [policy-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"

      - name: Run GHA cache hygiene protocol
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # Soft target after cleanup; hard fail above this (bytes)
          MAX_TOTAL_BYTES: "8589934592"   # 8 GiB — leave headroom under 10GB
          # Age-evict branch/PR noise; KEEP prefixes are never age-deleted
          MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_age_days || '14' }}
          # Always delete these key prefixes (orphaned Docker BuildKit GHA exports)
          DELETE_PREFIXES: "buildkit-,index-"
          # Never delete these (cargo / npm) via age or budget
          KEEP_PREFIXES: "v0-rust-,node-cache-"
        run: node tools/ci/gha-cache-hygiene.mjs
