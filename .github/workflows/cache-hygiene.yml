name: Cache hygiene

# Keeps the shared GitHub Actions cache budget (~10GB/repo) usable for
# rust-cache and npm. Docker BuildKit cache must live in GHCR (image-release
# registry cache), not as buildkit-blob / index-* GHA keys.
#
# This workflow is fail-soft for individual deletes but fails the job if usage
# remains above the hard threshold after cleanup (so the problem stays visible).

on:
  schedule:
    # Daily 06:17 UTC — off-peak relative to image-release / CI load
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List victims without deleting
        required: false
        default: false
        type: boolean

permissions:
  actions: write  # list + delete caches
  contents: read

concurrency:
  group: cache-hygiene
  cancel-in-progress: true

jobs:
  prune-gha-caches:
    name: Prune GHA caches (docker leftovers + budget)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0"

      - name: Run GHA cache hygiene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          # Soft target after cleanup; hard fail above this (bytes)
          MAX_TOTAL_BYTES: "8589934592"   # 8 GiB — leave headroom under 10GB
          # Always delete these key prefixes (orphaned Docker BuildKit GHA exports)
          DELETE_PREFIXES: "buildkit-,index-"
          # Never delete these (cargo / npm)
          KEEP_PREFIXES: "v0-rust-,node-cache-"
        run: node tools/ci/gha-cache-hygiene.mjs
